<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Jun.Tea · 综合反应测试</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0a0a0a;--panel:#111;--panel-2:#0d0d0d;--panel-3:#1a1a1a;
  --border:#1e1e1e;--border-2:#262626;
  --text:#e8e8e8;--text-2:#aaa;--text-3:#888;--text-4:#666;--text-5:#555;--text-6:#444;--text-7:#333;
  --accent:#00ffff;--accent-hover:#00cccc;--accent-dark:#00a0a0;--accent-bg:#001a1f;--accent-soft:#0d1618;
  --purple:#a855f7;--purple-light:#c084fc;--purple-soft:rgba(168,85,247,.08);--purple-soft2:rgba(168,85,247,.06);
  --good:#00d000;--bad:#ff5252;--warn:#ff9f43;--hover:#131313;--hover2:#222;--ts:#4a7a7a;
  --input-bg:#0a0a0a;--shadow:rgba(0,0,0,.88);
}
html[data-theme="light"]{
  --bg:#f2f3f5;--panel:#ffffff;--panel-2:#fafbfc;--panel-3:#eef0f3;
  --border:#e0e3e8;--border-2:#cbd0d7;
  --text:#1a1d23;--text-2:#4a5058;--text-3:#6b7280;--text-4:#8a9098;--text-5:#9aa3ad;--text-6:#aab3bd;--text-7:#c0c6ce;
  --accent:#0099aa;--accent-hover:#00808f;--accent-dark:#00808f;--accent-bg:#ffffff;--accent-soft:#e6f5f7;
  --purple:#7c3aed;--purple-light:#6d28d9;--purple-soft:rgba(124,58,237,.08);--purple-soft2:rgba(124,58,237,.06);
  --good:#16a34a;--bad:#dc2626;--warn:#ea580c;--hover:#f6f7f9;--hover2:#eef0f3;--ts:#7a95a0;
  --input-bg:#ffffff;--shadow:rgba(30,30,40,.28);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"JetBrains Mono","SF Mono",Consolas,"Courier New",monospace;background:var(--bg);color:var(--text);min-height:100vh;padding:24px 16px;user-select:none;-webkit-user-select:none;letter-spacing:.02em;display:flex;justify-content:center;align-items:flex-start;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:background .2s,color .2s}
.container{width:100%;max-width:960px}
.brand-bar{display:flex;justify-content:space-between;align-items:center;padding:0 4px 14px;border-bottom:1px solid var(--border);margin-bottom:16px;gap:12px;flex-wrap:wrap}
.brand{font-size:14px;font-weight:700;letter-spacing:.15em}
.brand .dot{color:var(--accent)}
.brand-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand-meta{font-size:11px;color:var(--text-5);letter-spacing:.1em}
.theme-btn{padding:0 12px;border:1px solid var(--border-2);background:var(--panel);color:var(--text-2);font-family:inherit;font-size:12px;cursor:pointer;height:28px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.theme-btn:hover{color:var(--accent);border-color:var(--accent-dark)}
.user-chip{display:inline-flex;align-items:center;gap:6px;padding:0 10px;border:1px solid var(--border);background:var(--panel-2);font-size:11px;letter-spacing:.1em;color:var(--text-2);height:28px;line-height:1}
.user-chip.admin{border-color:var(--purple);background:var(--purple-soft);color:var(--purple-light)}
.user-chip .star{color:var(--purple);font-size:11px;line-height:1}
.user-chip .uid{color:var(--text-4);font-size:10px}
.user-chip.admin .uid{color:var(--purple)}
.logout-btn{padding:0 12px;border:1px solid var(--border-2);background:var(--panel);color:var(--text-3);font-family:inherit;font-size:11px;cursor:pointer;height:28px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.logout-btn:hover{color:var(--bad);border-color:var(--bad)}
.mobile-tip{display:none;padding:14px 16px;background:rgba(255,159,67,.08);border:1px solid #3a2a10;color:var(--warn);font-size:12px;margin-bottom:16px;line-height:1.7}
.mobile-tip b{color:var(--warn)}
.login-wrap{display:flex;justify-content:center;align-items:center;min-height:70vh;width:100%}
.login-box{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--border);position:relative}
.login-brand{text-align:center;font-size:20px;font-weight:700;letter-spacing:.25em;padding:32px 32px 6px 32px}
.login-brand .dot{color:var(--accent)}
.login-sub{text-align:center;font-size:11px;color:var(--text-5);letter-spacing:.2em;margin-bottom:24px}
.login-tabs{display:flex;background:var(--panel-2);border-bottom:1px solid var(--border)}
.login-tab{flex:1;padding:14px;background:transparent;border:none;color:var(--text-4);font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.2em;cursor:pointer;position:relative}
.login-tab:hover{color:var(--text-2)}
.login-tab.active{color:var(--accent)}
.login-tab.active::after{content:'';position:absolute;bottom:-1px;left:20%;right:20%;height:2px;background:var(--accent)}
.login-panel{padding:28px 32px 56px 32px}
.login-panel.admin-mode{background:linear-gradient(180deg,var(--purple-soft) 0%,transparent 100%);border-top:2px solid var(--purple)}
.admin-badge{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;background:var(--purple-soft);border:1px solid var(--purple);margin-bottom:20px;font-size:11px;font-weight:700;letter-spacing:.25em;color:var(--purple-light)}
.login-field{margin-bottom:16px}
.login-field label{display:block;font-size:11px;color:var(--text-4);letter-spacing:.15em;margin-bottom:8px}
.login-field input{width:100%;padding:13px 14px;background:var(--input-bg);border:1px solid var(--border-2);color:var(--text);font-family:inherit;font-size:14px;outline:none;text-transform:uppercase;-webkit-appearance:none;border-radius:0}
.login-field input.pwd{text-transform:none}
.login-field input:focus{border-color:var(--accent)}
.login-panel.admin-mode .login-field input:focus{border-color:var(--purple)}
.login-error{font-size:12px;color:var(--bad);min-height:18px;margin-bottom:10px;line-height:1.5}
.login-btns{display:flex;gap:8px;margin-top:8px}
.login-btn{flex:1;padding:14px;background:var(--accent);color:var(--accent-bg);border:1px solid var(--accent);font-family:inherit;font-size:14px;font-weight:700;letter-spacing:.2em;cursor:pointer}
.login-btn:hover{background:var(--accent-hover)}
.login-btn:disabled{opacity:.5;cursor:not-allowed}
.login-btn.admin{background:var(--purple);color:#fff;border-color:var(--purple)}
.login-hint{font-size:10px;color:var(--text-5);text-align:center;margin-top:20px;line-height:1.9}
.login-corner{position:absolute;bottom:12px;right:12px;display:flex;gap:6px;z-index:100}
.login-corner-btn{padding:6px 12px;border:1px solid var(--border-2);background:var(--panel);color:var(--text-2);font-family:inherit;font-size:12px;cursor:pointer;line-height:1.4;min-width:44px}
.login-corner-btn:hover{color:var(--accent);border-color:var(--accent-dark)}
.lang-menu{position:absolute;bottom:52px;right:12px;background:var(--panel);border:1px solid var(--border-2);z-index:101;min-width:150px;box-shadow:0 6px 24px var(--shadow)}
.lang-menu-item{padding:10px 16px;font-size:13px;cursor:pointer;color:var(--text-2);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px}
.lang-menu-item:last-child{border-bottom:none}
.lang-menu-item:hover{background:var(--hover);color:var(--accent)}
.lang-menu-item.active{color:var(--accent);background:var(--accent-soft)}
.lang-menu-item .check{font-size:11px;opacity:0}
.lang-menu-item.active .check{opacity:1}
.view-title{font-size:14px;font-weight:700;letter-spacing:.2em;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.view-title .sub{font-size:11px;color:var(--text-4);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--border);padding:18px;cursor:pointer;opacity:0;animation:card-in .3s ease-out forwards}
@keyframes card-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.card:hover{border-color:var(--accent)}
.card.done{border-color:var(--accent-dark);background:var(--accent-soft)}
.card.expired{border-color:#3a1010}
html[data-theme="light"] .card.expired{border-color:#f5c2c2}
.card-name{font-size:14px;font-weight:700;letter-spacing:.1em;margin-bottom:6px}
.card-desc{font-size:11px;color:var(--text-4);line-height:1.5;margin-bottom:12px;min-height:32px}
.card-score{font-size:32px;font-weight:800;line-height:1}
.card-score .u{font-size:12px;color:var(--text-5);margin-left:4px}
.card-foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px;font-size:10px;color:var(--text-5)}
.card-tag{font-size:9px;padding:2px 6px;border:1px solid var(--border-2);color:var(--text-4)}
.card-tag.done{color:var(--accent);border-color:var(--accent-dark)}
.card-tag.expired{color:var(--bad);border-color:#3a1010}
.summary{margin-top:16px;background:var(--panel);border:1px solid var(--border);padding:18px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.summary-total{font-size:40px;font-weight:800;line-height:1}
.summary-total .u{font-size:14px;color:var(--text-5);margin-left:6px}
.summary-info{font-size:11px;color:var(--text-4);line-height:1.8}
.summary-info b{color:var(--text)}
.summary-locked{font-size:11px;color:var(--warn);padding:8px 12px;border:1px solid #3a2a10;background:#1a1408}
html[data-theme="light"] .summary-locked{border-color:#f5d8b0;background:#fff7ea}
.test-area{background:var(--panel);border:1px solid var(--border);min-height:420px;display:flex;flex-direction:column}
.test-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
.test-header-name{font-size:13px;font-weight:700;letter-spacing:.2em;color:var(--accent)}
.test-header-info{font-size:11px;color:var(--text-4)}
.test-body{flex:1;position:relative;min-height:380px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.test-panel{width:100%;height:380px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;position:relative;background:var(--panel)}
.test-panel.w{background:#8a1f1f}
.test-panel.r{background:#00d000}
.test-panel.e{background:#5a1010}
.test-panel.s{background:#0d2430}
.test-panel.i{background:#3a0a0a}
.test-panel .mt{font-size:26px;font-weight:700;color:#fff;text-align:center;padding:0 20px;line-height:1.4}
.test-panel .st{font-size:13px;color:rgba(255,255,255,.7);text-align:center;margin-top:10px;padding:0 20px}
.aim-target{position:absolute;border-radius:50%;background:var(--accent);cursor:crosshair;border:2px solid var(--accent-dark);display:flex;align-items:center;justify-content:center;color:var(--accent-bg);font-weight:800}
.seq-grid{display:grid;gap:4px;background:var(--border);border:1px solid var(--border);padding:4px}
.seq-cell{background:var(--panel-3);cursor:pointer}
.seq-cell:hover{background:var(--hover2)}
.seq-cell.on{background:var(--accent)}
.seq-cell.ok{background:var(--accent-dark)}
.num-display{font-size:72px;font-weight:800;color:var(--text);letter-spacing:.1em;text-align:center}
.num-input{padding:16px;font-size:24px;background:var(--input-bg);border:1px solid var(--border-2);color:var(--text);font-family:inherit;letter-spacing:.2em;text-align:center;outline:none;width:100%;max-width:500px;-webkit-appearance:none;border-radius:0}
.num-input:focus{border-color:var(--accent)}
.color-grid{display:grid;gap:8px;padding:8px}
.color-cell{cursor:pointer;border-radius:4px}
.typing-text{font-size:17px;line-height:1.9;padding:16px 24px;color:var(--text-4);text-align:left;max-width:820px;height:140px;overflow:hidden;border:1px solid var(--border);background:var(--panel-2)}
.typing-text .ok{color:var(--accent)}
.typing-text .bad{color:var(--bad);background:rgba(255,82,82,.15)}
.typing-text .cur{border-bottom:2px solid var(--text);background:var(--panel-3)}
.typing-input{width:100%;max-width:820px;padding:12px 14px;font-size:17px;background:var(--input-bg);border:1px solid var(--border-2);color:var(--text);font-family:inherit;outline:none;margin-top:16px;-webkit-appearance:none;border-radius:0}
.typing-input:focus{border-color:var(--accent)}
.chase-area{position:relative;width:100%;height:380px;background:var(--bg);cursor:crosshair;overflow:hidden}
.chase-target{position:absolute;border-radius:50%;background:radial-gradient(circle,var(--accent),var(--accent-dark));border:2px solid #fff;pointer-events:none}
.chase-cursor{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--bad);pointer-events:none;transform:translate(-50%,-50%);border:2px solid #fff}
.test-foot{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-top:1px solid var(--border);font-size:11px;color:var(--text-4)}
.leaderboard-section{margin-top:16px;border:1px solid var(--border);background:var(--panel)}
.leaderboard-header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--panel-2);border-bottom:1px solid var(--border);cursor:pointer}
.leaderboard-header:hover{background:var(--hover)}
.leaderboard-header-title{font-size:12px;font-weight:700;letter-spacing:.2em;display:flex;align-items:center;gap:10px}
.leaderboard-header-count{font-size:11px;color:var(--accent)}
.leaderboard-toggle{font-size:11px;color:var(--text-5)}
.leaderboard-body{display:block}
.leaderboard-body.collapsed{display:none}
.lb-filters{display:flex;gap:6px;padding:10px 14px;background:var(--panel-2);border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center}
.lb-fbtn{padding:4px 12px;border:1px solid var(--border-2);background:var(--panel);color:var(--text-3);font-family:inherit;font-size:11px;cursor:pointer;line-height:1.4}
.lb-fbtn:hover{color:var(--accent);border-color:var(--accent-dark)}
.lb-fbtn.active{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.lb-fsep{width:1px;height:16px;background:var(--border-2);margin:0 4px}
.lb-fsel{padding:4px 10px;background:var(--panel);border:1px solid var(--border-2);color:var(--text-3);font-family:inherit;font-size:11px;cursor:pointer;outline:none;min-width:110px}
.lb-fsel:focus{border-color:var(--accent);color:var(--accent)}
.lb-fsel option{background:var(--panel);color:var(--text)}
.lb-fsel option:checked{background:var(--accent-soft);color:var(--accent)}
.lb-fdrop{position:relative;display:inline-block;min-width:120px}
.lb-fdrop-btn{padding:4px 28px 4px 10px;background:var(--panel);border:1px solid var(--border-2);color:var(--text-3);font-family:inherit;font-size:11px;cursor:pointer;outline:none;line-height:1.4;width:100%;text-align:left;position:relative}
.lb-fdrop-btn:hover{color:var(--accent);border-color:var(--accent-dark)}
.lb-fdrop-btn::after{content:'';position:absolute;right:8px;top:50%;transform:translateY(-50%);border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid currentColor;opacity:.6}
.lb-fdrop.open .lb-fdrop-btn{color:var(--accent);border-color:var(--accent)}
.lb-fdrop-menu{position:absolute;top:100%;left:0;right:0;background:var(--panel);border:1px solid var(--accent);margin-top:2px;z-index:200;max-height:240px;overflow-y:auto;box-shadow:0 6px 20px var(--shadow);display:none}
.lb-fdrop.open .lb-fdrop-menu{display:block}
.lb-fdrop-item{padding:6px 12px;font-size:11px;color:var(--text-2);cursor:pointer;white-space:nowrap}
.lb-fdrop-item:hover{background:var(--hover);color:var(--accent)}
.lb-fdrop-item.active{background:var(--accent-soft);color:var(--accent);font-weight:700}
.lb-fright{margin-left:auto;font-size:11px;color:var(--text-4)}
.lb-beat{flex:none;font-size:10px;color:var(--text-4);white-space:nowrap}
.lb-beat b{color:var(--accent);font-weight:700}
.lb-skeleton{padding:14px;border-bottom:1px solid var(--border)}
.lb-skel-line{height:11px;background:var(--panel-3);margin-bottom:8px;animation:lb-skel 1.5s ease-in-out infinite}
.lb-skel-line:nth-child(1){width:55%}
.lb-skel-line:nth-child(2){width:88%}
.lb-skel-line:nth-child(3){width:40%;margin-bottom:0}
@keyframes lb-skel{0%,100%{opacity:.35}50%{opacity:.75}}
@keyframes rec-flash{0%{color:inherit;text-shadow:none}15%{color:#ffd700;text-shadow:0 0 10px rgba(255,215,0,.75)}100%{color:inherit;text-shadow:none}}
.rec-flash{animation:rec-flash 1.4s ease-out}
.lb-group{border-bottom:1px solid var(--border)}
.lb-group:last-child{border-bottom:none}
.lb-row{padding:9px 14px;cursor:pointer;font-size:13px}
.lb-row:hover{background:var(--hover)}
.lb-group.rank-1 .lb-row{background:linear-gradient(90deg,rgba(255,215,0,.14) 0%,rgba(255,215,0,.02) 55%,transparent 100%);border-left:3px solid #ffd700}
.lb-group.rank-2 .lb-row{background:linear-gradient(90deg,rgba(192,192,192,.12) 0%,rgba(192,192,192,.02) 55%,transparent 100%);border-left:3px solid #c0c0c0}
.lb-group.rank-3 .lb-row{background:linear-gradient(90deg,rgba(205,127,50,.12) 0%,rgba(205,127,50,.02) 55%,transparent 100%);border-left:3px solid #cd7f32}
.lb-group.is-admin .lb-row{background:linear-gradient(90deg,var(--purple-soft) 0%,var(--purple-soft2) 55%,transparent 100%);border-left:3px solid var(--purple)}
.lb-group.is-me .lb-row{box-shadow:inset 0 0 0 1px var(--purple-soft)}
.lb-line1{display:flex;align-items:center;gap:10px;min-width:0;line-height:1.35}
.lb-rank{flex:none;font-weight:800;font-size:14px;min-width:30px}
.lb-group.rank-1 .lb-rank{color:#ffd700}
.lb-group.rank-2 .lb-rank{color:#c0c0c0}
.lb-group.rank-3 .lb-rank{color:#cd7f32}
.lb-group.is-admin .lb-rank{color:var(--purple-light)}
.lb-group:not(.rank-1):not(.rank-2):not(.rank-3):not(.is-admin) .lb-rank{color:var(--text-5);font-size:12px;font-weight:700}
.lb-name{flex:none;display:flex;align-items:center;gap:5px;max-width:240px;overflow:hidden;white-space:nowrap;color:var(--text);font-weight:600;font-size:13px;cursor:pointer}
.lb-name:hover{color:var(--accent) !important}
.lb-group.is-admin .lb-name{color:var(--purple-light)}
.lb-name .star{color:var(--purple);font-size:13px}
.lb-name .uid{font-size:10px;color:var(--text-5);font-weight:400}
.lb-name .cnt{font-size:10px;padding:1px 6px;background:var(--panel-3);border:1px solid var(--border-2);color:var(--text-3)}
.lb-gear{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-5);font-size:11px}
.lb-latest{margin-left:auto;display:flex;align-items:center;gap:10px;white-space:nowrap;font-size:11px}
.lb-latest .tag{color:var(--accent);font-weight:700;letter-spacing:.08em;font-size:10px;flex:none}
.lb-di{white-space:nowrap;display:inline-flex;align-items:center}
.lb-di .k{color:var(--text-6);font-style:normal;margin-right:3px}
.lb-di .v{color:var(--text-2);font-weight:600;margin-left:2px}
.lb-score{color:var(--accent);font-weight:800;font-size:15px;text-align:right;white-space:nowrap;flex:none}
.lb-score i{font-style:normal;font-size:10px;color:var(--ts);margin-left:1px}
.lb-group.is-admin .lb-score{color:var(--purple-light)}
.lb-grade{font-weight:800;font-size:13px;min-width:16px;text-align:right;flex:none}
.lb-line2{display:flex;align-items:center;gap:16px;margin-top:5px;padding-top:6px;border-top:1px solid var(--border);font-size:11px;color:var(--text-4);flex-wrap:wrap}
.lb-best-info{display:flex;align-items:center;gap:10px;white-space:nowrap;flex-wrap:wrap}
.lb-best-info .tag-best{color:var(--accent);font-weight:700;letter-spacing:.08em;font-size:10px;flex:none}
.lb-best-info .best-time{color:var(--ts);font-size:10px;white-space:nowrap}
.lb-right2{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.lb-prev-time{display:flex;align-items:center;gap:5px;white-space:nowrap;font-size:10px}
.lb-prev-time .tag{color:var(--accent);font-weight:700;letter-spacing:.08em}
.lb-prev-time .time{color:var(--ts)}
.lb-history{background:var(--panel-2);border-top:1px solid var(--border)}
.lb-history.collapsed{display:none}
.lb-history-inner{padding:8px 16px 12px 54px;display:flex;flex-wrap:wrap;gap:8px}

}

async function doUserRegister(){
  var _chk=document.getElementById('adminModeCheck');
  if(_chk&&_chk.checked){userLoginError.textContent=t('msgNoAdminReg');return;}
  var name=normalizeName(userLoginName.value);
  var key=userLoginKey.value.trim();
  userLoginError.textContent='';
  userLoginName.value=name;
  if(!name){userLoginError.textContent=t('msgNameOnly');userLoginName.focus();return;}
  if(name.length<2){userLoginError.textContent=t('msgNameMin');return;}
  if(!key){userLoginError.textContent=t('msgSetPwd');userLoginKey.focus();return;}
  if(key.length<4){userLoginError.textContent=t('msgPwdMin');return;}
  if(name===DEFAULT_ADMIN_NAME){userLoginError.textContent=t('msgNameTaken');return;}
  var cd=checkRegisterCooldown();
  if(!cd.ok){userLoginError.textContent=cd.msg;return;}
  var keyHash=userKeyHash(name,key);
  var checkRes=await supabase.from('users').select('*').eq('name',name).eq('key_hash',keyHash);
  if(checkRes.error){userLoginError.textContent=t('msgNetErr')+checkRes.error.message;return;}
  if(checkRes.data&&checkRes.data.length>0){userLoginError.textContent=t('msgAlreadyReg');return;}
  var newId=genUserId();
  var insRes=await supabase.from('users').insert([{id:newId,name:name,key_hash:keyHash,is_admin:false,created_ts:Date.now()}]);
  if(insRes.error){userLoginError.textContent=t('msgSaveFail')+insRes.error.message;return;}
  recordRegisterTime();
  alert(t('msgRegisterOk')+name+t('msgRegisterOk2')+newId+t('msgRegisterOk3'));
  currentUser={name:name,id:newId,isAdmin:false,loginTs:Date.now()};
  saveCurrentUser(currentUser);
  enterMain();
}

async function doUserLogin(){
  var name=normalizeName(userLoginName.value);
  var key=userLoginKey.value.trim();
  userLoginError.textContent='';
  userLoginName.value=name;
  if(!name){userLoginError.textContent=t('msgNameOnly');userLoginName.focus();return;}
  if(!key){userLoginError.textContent=t('msgSetPwd');userLoginKey.focus();return;}
  if(name===DEFAULT_ADMIN_NAME){userLoginError.textContent=t('msgNameTaken');return;}
  var keyHash=userKeyHash(name,key);
  var res=await supabase.from('users').select('*').eq('name',name).eq('key_hash',keyHash);
  if(res.error){userLoginError.textContent=t('msgNetErr')+res.error.message;return;}
  if(!res.data||res.data.length===0){userLoginError.textContent=t('msgLoginFail');return;}
  var u=res.data[0];
  if(u.is_admin){userLoginError.textContent=t('msgAdminEntry');return;}
  currentUser={name:name,id:u.id,isAdmin:false,loginTs:Date.now()};
  saveCurrentUser(currentUser);
  enterMain();
}

async function doAdminLogin(){
  var name=normalizeName(adminLoginName.value);
  var key=adminLoginKey.value.trim();
  adminLoginError.textContent='';
  adminLoginName.value=name;
  if(!name){adminLoginError.textContent=t('msgAdminName');adminLoginName.focus();return;}
  if(!key){adminLoginError.textContent=t('msgAdminPwd');adminLoginKey.focus();return;}
  if(name===DEFAULT_ADMIN_NAME&&key===DEFAULT_ADMIN_KEY){
    currentUser={name:name,id:DEFAULT_ADMIN_ID,isAdmin:true,loginTs:Date.now()};
    saveCurrentUser(currentUser);enterMain();return;
  }
  var res=await supabase.from('users').select('*').eq('name',name).eq('is_admin',true);
  if(res.error){adminLoginError.textContent=t('msgNetErr')+res.error.message;return;}
  if(!res.data||res.data.length===0){adminLoginError.textContent=t('msgAdminNotFound');return;}
  var u=res.data[0];
  if(u.key_hash!==userKeyHash(name,key)){adminLoginError.textContent=t('msgAdminPwdWrong');return;}
  currentUser={name:name,id:u.id,isAdmin:true,loginTs:Date.now()};
  saveCurrentUser(currentUser);
  enterMain();
}

async function fetchCloudLeaderboard(){
  leaderboardBody.innerHTML='<div class="lb-skeleton"><div class="lb-skel-line"></div><div class="lb-skel-line"></div><div class="lb-skel-line"></div></div><div class="lb-skeleton"><div class="lb-skel-line"></div><div class="lb-skel-line"></div><div class="lb-skel-line"></div></div>';
  try{
    var res=await supabase.from('leaderboard').select('*').order('score',{ascending:false}).limit(CONFIG.maxLeaderboard);
    if(res.error){leaderboardBody.innerHTML='<div class="lb-empty">'+t('loadFailed')+escapeHtml(res.error.message)+'</div>';return;}
    cloudLeaderboardCache=res.data||[];
    try{
      var ures=await supabase.from('users').select('id,mouse,keyboard');
      if(ures.data){
        userGearCache={};
        for(var gi=0;gi<ures.data.length;gi++){
          var gu=ures.data[gi];
          var m=(gu.mouse||'').trim(),k=(gu.keyboard||'').trim();
          if(m||k)userGearCache[gu.id]={mouse:m,keyboard:k};
        }
      }
    }catch(e){}
    refreshLeaderboardDisplay();
  }catch(e){leaderboardBody.innerHTML='<div class="lb-empty">'+t('netError')+escapeHtml(String(e.message||e))+'</div>';}
}
async function addToLeaderboard(entry){
  try{
    var res=await supabase.from('leaderboard').insert([{id:entry.id,name:entry.name,user_id:entry.userId,is_admin:entry.isAdmin,score:entry.score,rank:entry.rank,projects:entry.projects,ts:entry.ts}]);
    if(res.error){alert(t('msgSaveFail')+res.error.message);return false;}
    lastSavedId=entry.id;
    await fetchCloudLeaderboard();
    return true;
  }catch(e){alert(t('msgNetErr')+e.message);return false;}
}
function getBeatPercent(rank,total){if(!total||total<=1)return 100;return Math.round((1-rank/total)*100);}
function groupByUser(list){
  var map={};
  (list||[]).forEach(function(item){
    var key=item.user_id||item.id||item.name;
    if(!map[key])map[key]={userId:key,name:item.name,isAdmin:!!item.is_admin,records:[]};
    map[key].records.push(item);
  });
  var groups=Object.keys(map).map(function(k){var g=map[k];g.records.sort(function(a,b){return b.score-a.score;});g.best=g.records[0];return g;});
  groups.sort(function(a,b){return b.best.score-a.best.score;});
  return groups;
}

function refreshLeaderboardDisplay(hid){
  var list=cloudLeaderboardCache||[];
  var todayStart=new Date();todayStart.setHours(0,0,0,0);
  var todayTs=todayStart.getTime();
  var weekStart=todayTs-((todayStart.getDay()||7)-1)*86400000;
  if(lbTimeFilter==='today')list=list.filter(function(x){return x.ts>=todayTs;});
  else if(lbTimeFilter==='week')list=list.filter(function(x){return x.ts>=weekStart;});
  var groups=groupByUser(list);
  if(lbProjectFilter!=='total'){
    groups=groups.filter(function(g){return getProjectScore(g.best,lbProjectFilter)!==null;});
    groups.sort(function(a,b){var va=getProjectScore(a.best,lbProjectFilter)||0;var vb=getProjectScore(b.best,lbProjectFilter)||0;return vb-va;});
  }
  leaderboardCount.textContent=groups.length+' '+t('unitPerson');
  leaderboardBody.innerHTML=renderLeaderboardHtml(groups,hid||lastSavedId);
  renderLbFilters(groups.length);
  applyLeaderboardOpenState();
}
var LB_DETAIL_PROJECTS=[{key:'reaction',label:'lbReaction'},{key:'sequence',label:'lbSequence'},{key:'number',label:'lbNumber'}];
function getProjectScore(rec,key){
  if(!rec||!rec.projects||!rec.projects.length)return null;
  for(var i=0;i<rec.projects.length;i++){var p=rec.projects[i];if(p&&p.key===key)return p.score;}
  return null;
}
function renderLeaderboardHtml(groups,hid){
  if(!groups||groups.length===0)return '<div class="lb-empty">'+t('lbEmpty')+'</div>';
  var showTs=!!CONFIG.showTimestamp;
  var top=groups.slice(0,CONFIG.topDisplay);
  return top.map(function(g,index){
    var best=g.best;
    var byTs=g.records.slice().sort(function(a,b){return b.ts-a.ts;});
    var latest=byTs[0];
    var c=gradeColor(best.rank);
    var cls='lb-group';
    if(index===0)cls+=' rank-1';else if(index===1)cls+=' rank-2';else if(index===2)cls+=' rank-3';
    if(g.isAdmin)cls+=' is-admin';
    var isMe=hid&&g.records.some(function(r){return r.id===hid;});
    if(isMe)cls+=' is-me';
    var star=g.isAdmin?'<span class="star">★</span>':'';
    var cnt=g.records.length;
    var beatPct=getBeatPercent(index,top.length);
    var _gi=userGearCache[g.userId]||{};
    var _gp=[];
    if(_gi.mouse)_gp.push(t('mouse')+' '+_gi.mouse);
    if(_gi.keyboard)_gp.push(t('keyboard')+' '+_gi.keyboard);
    var gear=_gp.join(' · ');
    var scoreColor=g.isAdmin?'var(--purple-light)':'var(--accent)';
    var latestItems=[];
    LB_DETAIL_PROJECTS.forEach(function(d){var v=getProjectScore(latest,d.key);if(v!==null&&v!==undefined)latestItems.push('<span class="lb-di"><i class="k">'+t(d.label)+'</i><b class="v">'+v+'</b></span>');});
    var displayScore,displayRank,displayColor;
    if(lbProjectFilter==='total'){displayScore=latest.score;displayRank=latest.rank;displayColor=gradeColor(latest.rank);}
    else{displayScore=getProjectScore(latest,lbProjectFilter)||0;displayRank=getGrade(displayScore);displayColor=gradeColor(displayRank);}
    var line1='<div class="lb-line1">'+
      '<span class="lb-rank">#'+(index+1)+'</span>'+
      '<span class="lb-name">'+escapeHtml(g.name)+star+'<span class="uid">#'+escapeHtml(g.userId)+'</span>'+(cnt>1?'<span class="cnt">'+cnt+t('timesSuffix')+'</span>':'')+'</span>'+
      (gear?'<span class="lb-gear">'+escapeHtml(gear)+'</span>':'')+
           '<span class="lb-latest"><span class="tag">'+t('lbLatest')+'</span>'+latestItems.join('')+'<span class="lb-grade" style="color:'+displayColor+'">'+escapeHtml(displayRank)+'</span><span class="lb-score" style="color:'+scoreColor+'">'+displayScore+'<i>'+t('unitPt')+'</i></span></span>'+
    '</div>';
    var bestItems=[];
    LB_DETAIL_PROJECTS.forEach(function(d){var v=getProjectScore(best,d.key);if(v!==null&&v!==undefined)bestItems.push('<span class="lb-di"><i class="k">'+t(d.label)+'</i><b class="v">'+v+'</b></span>');});
    var bestInfo='<div class="lb-best-info"><span class="tag-best">'+t('lbBest')+'</span>'+(showTs&&best.ts?'<span class="best-time">'+formatTsShort(best.ts)+'</span>':'')+bestItems.join('')+'<span class="lb-grade" style="color:'+c+'">'+escapeHtml(best.rank)+'</span><span class="lb-score" style="color:'+scoreColor+'">'+best.score+'<i>'+t('unitPt')+'</i></span></div>';
    var right2='<div class="lb-right2"><div class="lb-beat">'+t('lbBeat')+' <b>'+beatPct+'%</b></div>';
    if(showTs&&latest.ts){right2+='<div class="lb-prev-time"><span class="tag">'+t('lbLatestTime')+'</span><span class="time">'+formatTsShort(latest.ts)+'</span></div>';}
    right2+='</div>';
    var line2='';
    if(bestInfo||right2){line2='<div class="lb-line2">'+bestInfo+right2+'</div>';}
    var row='<div class="lb-row" data-uid="'+escapeHtml(g.userId)+'">'+line1+line2+'</div>';
    var hist='';
    if(cnt>1){
      var expanded=!!expandedGroups[g.userId];
      var recsForHist=g.records.slice();

function loadSession(){try{var r=localStorage.getItem(CONFIG.sessionKey);return r?JSON.parse(r):{};}catch(e){return {};}}

function remainingMinutes(e){if(!e||typeof e.ts!=='number')return 0;return Math.max(0,Math.floor(((CONFIG.resultExpireMinutes*60*1000)-(Date.now()-e.ts))/60000));}
function getEnabledProjects(){var o=[];for(var k in CONFIG.projects){if(CONFIG.projects[k]&&CONFIG.projects[k].enabled){if(IS_MOBILE&&!isProjectAvailableOnMobile(k))continue;o.push(k);}}return o;}
function computeTotal(){
  var s=purgeExpiredSession();var en=getEnabledProjects();var tw=0,ws=0;var items=[];
  en.forEach(function(k){var e=s[k],p=CONFIG.projects[k];if(e&&!isExpired(e)){ws+=e.score*p.weight;tw+=p.weight;items.push({key:k,score:e.score,weight:p.weight});}});
  var req=CONFIG.minTestsForTotal;
  if(IS_MOBILE&&req>en.length)req=en.length;
  var ready=items.length>=req;
  if(tw<=0||!ready)return{total:0,grade:'—',items:items,tested:items.length,totalCount:en.length,ready:false,required:req,need:Math.max(0,req-items.length)};
  var total=Math.round(ws/tw);

}

TESTS.chase={start:function(area,finish){
  var p=CONFIG.projects.chase;var wrap=document.createElement('div');wrap.style.width='100%';
  var info=document.createElement('div');info.style.cssText='font-size:13px;color:var(--text-3);text-align:center;padding:12px';info.textContent=t('tClickStart')+' · '+t('tFollowMouse')+' · '+p.durationSec+t('tSec');
  var arena=document.createElement('div');arena.className='chase-area';
  var target=document.createElement('div');target.className='chase-target';target.style.width=p.targetSize+'px';target.style.height=p.targetSize+'px';target.style.display='none';
  var cursor=document.createElement('div');cursor.className='chase-cursor';cursor.style.display='none';
  arena.appendChild(target);arena.appendChild(cursor);wrap.appendChild(info);wrap.appendChild(arena);area.appendChild(wrap);
  var state={phase:'intro',mouseX:0,mouseY:0,inT:0,tt:0,raf:null,timer:null,lastTs:0,startTs:0,
    freqX1:0,freqX2:0,freqY1:0,freqY2:0,phaseX1:0,phaseX2:0,phaseY1:0,phaseY2:0,ampX1:0,ampX2:0,ampY1:0,ampY2:0,speedScale:1};
  var _chaseInfoTimer=null;
  function initRandomPath(){
    var sp=p.speed;
    state.speedScale=Math.max(0.25,Math.min(2.0,sp/3.0));
    state.freqX1=0.15+Math.random()*0.15;state.freqX2=0.45+Math.random()*0.35;
    state.freqY1=0.15+Math.random()*0.15;state.freqY2=0.45+Math.random()*0.35;
    state.phaseX1=Math.random()*Math.PI*2;state.phaseX2=Math.random()*Math.PI*2;
    state.phaseY1=Math.random()*Math.PI*2;state.phaseY2=Math.random()*Math.PI*2;
    state.ampX1=0.55+Math.random()*0.25;state.ampX2=0.20+Math.random()*0.20;
    state.ampY1=0.55+Math.random()*0.25;state.ampY2=0.20+Math.random()*0.20;
  }
  function step(){
    if(state.phase!=='run')return;
    var sz=p.targetSize;var w=arena.clientWidth-sz;var h=arena.clientHeight-sz;
    var cx=w/2,cy=h/2;
    var now=performance.now();
    var tt=(now-state.startTs)/1000*state.speedScale;
    var nx=Math.sin(tt*state.freqX1*Math.PI*2+state.phaseX1)*state.ampX1+Math.sin(tt*state.freqX2*Math.PI*2+state.phaseX2)*state.ampX2;
    var ny=Math.sin(tt*state.freqY1*Math.PI*2+state.phaseY1)*state.ampY1+Math.sin(tt*state.freqY2*Math.PI*2+state.phaseY2)*state.ampY2;
    if(nx>1)nx=1;if(nx<-1)nx=-1;if(ny>1)ny=1;if(ny<-1)ny=-1;
    var x=cx+nx*(w/2);var y=cy+ny*(h/2);
    target.style.left=x+'px';target.style.top=y+'px';
    var tcx=x+sz/2,tcy=y+sz/2;
    var dx=state.mouseX-tcx,dy=state.mouseY-tcy;
    var inTarget=Math.sqrt(dx*dx+dy*dy)<sz/2;
    var dt=now-state.lastTs;state.tt+=dt;if(inTarget)state.inT+=dt;
    state.lastTs=now;state.raf=requestAnimationFrame(step);
  }
  arena.addEventListener('pointermove',function(e){var r=arena.getBoundingClientRect();state.mouseX=e.clientX-r.left;state.mouseY=e.clientY-r.top;cursor.style.left=state.mouseX+'px';cursor.style.top=state.mouseY+'px';});
  arena.addEventListener('pointerdown',function(e){
    if(state.phase!=='intro')return;if(e.pointerType==='mouse'&&e.button!==0)return;
    state.phase='run';target.style.display='block';cursor.style.display='block';
    var r=arena.getBoundingClientRect();state.mouseX=e.clientX-r.left;state.mouseY=e.clientY-r.top;
    initRandomPath();state.startTs=performance.now();state.lastTs=state.startTs;state.inT=0;state.tt=0;
    info.textContent=t('tTrack')+' 0.0%';
    _chaseInfoTimer=setInterval(function(){
      if(state.phase!=='run'){clearInterval(_chaseInfoTimer);return;}
      var _pct=state.tt>0?state.inT/state.tt*100:0;
      info.textContent=t('tTrack')+' '+_pct.toFixed(1)+'%';
    },200);
    state.raf=requestAnimationFrame(step);
    state.timer=setTimeout(function(){
      state.phase='done';cancelAnimationFrame(state.raf);
      if(_chaseInfoTimer)clearInterval(_chaseInfoTimer);
      var pct=state.tt>0?state.inT/state.tt*100:0;var s=Math.round(pct);
      info.textContent=t('tHitRate')+' '+pct.toFixed(1)+'%';
      sfxDone();
      setTimeout(function(){finish(s,{hitPercent:Math.round(pct)});},1000);
    },p.durationSec*1000);
  });
  currentCleanup=function(){if(state.raf)cancelAnimationFrame(state.raf);if(state.timer)clearTimeout(state.timer);if(_chaseInfoTimer)clearInterval(_chaseInfoTimer);};
}};

TESTS.sound={start:function(area,finish){
  var p=CONFIG.projects.sound;
  var state={mode:'idle',times:[],timer:null,startT:null};
  var panel=makeTestPanel('',t('tClickStart'),p.trials+' '+t('tTimesCount'));
  area.appendChild(panel);
  function next(){
    state.mode='waiting';
    panel.className='test-panel r';
    panel.querySelector('.mt').textContent=t('tListen');
    panel.querySelector('.st').textContent=t('tHearBeep');
    state.timer=setTimeout(function(){
      state.mode='ready';
      playBeep(880,0.12,'square',0.15);
      state.startT=performance.now();
    },p.delayMin+Math.random()*(p.delayMax-p.delayMin));
  }
  function handler(e){
    if(e.pointerType==='mouse'&&e.button!==0)return;
    ensureAudio();
    if(state.mode==='idle'){next();return;}
    if(state.mode==='waiting'){
      clearTimeout(state.timer);
      state.mode='idle';
      panel.className='test-panel e';
      panel.querySelector('.mt').textContent=t('tTooEarly');
      panel.querySelector('.st').textContent=t('tClickRetry');
      playBeep(300,0.12,'square',0.08);
      return;
    }
    if(state.mode==='ready'){
      var tt=Math.round(performance.now()-state.startT);
      state.times.push(tt);
      if(state.times.length>=p.trials){
        var avg=state.times.reduce(function(a,b){return a+b;},0)/state.times.length;
        var score=Math.max(0,Math.min(100,100-(avg-p.speedBase)*p.speedFactor));
        state.mode='done';
        panel.className='test-panel s';
        panel.querySelector('.mt').textContent=t('tDone');
        var _min=Math.min.apply(null,state.times);
        panel.querySelector('.st').textContent=t('tAvg')+' '+Math.round(avg)+'ms · '+t('tBest')+' '+_min+'ms';
        sfxDone();
        setTimeout(function(){finish(Math.round(score),{times:state.times,avg:Math.round(avg),best:_min});},1100);
        return;
      }
      state.mode='idle';
      panel.className='test-panel s';
      panel.querySelector('.mt').textContent=tt+'ms';
      panel.querySelector('.st').textContent='('+state.times.length+'/'+p.trials+')';
      playBeep(1000,0.05,'square',0.06);
      setTimeout(next,700);
    }
  }
  panel.addEventListener('pointerdown',handler);
  currentCleanup=function(){clearTimeout(state.timer);panel.removeEventListener('pointerdown',handler);};
}};

function buildRadarSvg(latest){
  var keys=['reaction','aim','sequence','number','color','typing','chase','sound'];
  var labels={reaction:'反应',aim:'瞄准',sequence:'序列',number:'记忆',color:'色觉',typing:'打字',chase:'追踪',sound:'听觉'};
  var N=keys.length;
  var cx=180,cy=160,r=120;
  var vals=keys.map(function(k){var v=getProjectScore(latest,k);return v===null?0:v;});
  var angleStep=(Math.PI*2)/N;
  var h='<svg class="radar-svg" viewBox="0 0 360 320">';
  for(var ring=1;ring<=4;ring++){
    var rr=r*ring/4;
    var pts=[];
    for(var i=0;i<N;i++){
      var ang=-Math.PI/2+i*angleStep;
      pts.push((cx+Math.cos(ang)*rr).toFixed(1)+','+(cy+Math.sin(ang)*rr).toFixed(1));
    }
    h+='<polygon class="radar-ring" points="'+pts.join(' ')+'"/>';
  }
  for(var i2=0;i2<N;i2++){
    var a=-Math.PI/2+i2*angleStep;
    h+='<line class="radar-axis-line" x1="'+cx+'" y1="'+cy+'" x2="'+(cx+Math.cos(a)*r).toFixed(1)+'" y2="'+(cy+Math.sin(a)*r).toFixed(1)+'"/>';
    var lx=cx+Math.cos(a)*(r+18);
    var ly=cy+Math.sin(a)*(r+18);
    h+='<text class="radar-axis-label" x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="middle" dominant-baseline="middle">'+labels[keys[i2]]+'</text>';
  }
  var polyPts=[];
  for(var j=0;j<N;j++){
    var vv=Math.max(0,Math.min(100,vals[j]));
    var ang2=-Math.PI/2+j*angleStep;
    var rr2=r*vv/100;
    polyPts.push((cx+Math.cos(ang2)*rr2).toFixed(1)+','+(cy+Math.sin(ang2)*rr2).toFixed(1));
  }
  h+='<polygon class="radar-poly" points="'+polyPts.join(' ')+'"/>';
  for(var k2=0;k2<N;k2++){
    var vv2=Math.max(0,Math.min(100,vals[k2]));
    var ang3=-Math.PI/2+k2*angleStep;
    var rr3=r*vv2/100;
    h+='<circle class="radar-dot" cx="'+(cx+Math.cos(ang3)*rr3).toFixed(1)+'" cy="'+(cy+Math.sin(ang3)*rr3).toFixed(1)+'" r="3"/>';
  }
  h+='</svg>';
  return h;
}
function buildGrowthSvg(scores){
  if(!scores||scores.length===0)return '';
  var sorted=scores.slice().sort(function(a,b){return a.ts-b.ts;});
  var data=sorted.slice(-20);
  var W=760,H=200,padL=36,padR=12,padT=16,padB=26;
  var innerW=W-padL-padR,innerH=H-padT-padB;
  var scores2=data.map(function(x){return x.score||0;});
  var minS=Math.min.apply(null,scores2);
  var maxS=Math.max.apply(null,scores2);
  if(maxS-minS<10){minS=Math.max(0,minS-5);maxS=Math.min(100,maxS+5);}
  var h='<svg class="growth-svg" viewBox="0 0 '+W+' '+H+'">';
  for(var g=0;g<=4;g++){
    var yy=padT+innerH*g/4;
    var val=Math.round(maxS-(maxS-minS)*g/4);
    h+='<line class="growth-grid" x1="'+padL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+yy.toFixed(1)+'"/>';
    h+='<text class="growth-axis-label" x="'+(padL-6)+'" y="'+yy.toFixed(1)+'" text-anchor="end" dominant-baseline="middle">'+val+'</text>';
  }
  var pts=[],linePts=[];
  for(var i=0;i<data.length;i++){
    var x=padL+(data.length===1?innerW/2:innerW*i/(data.length-1));
    var y=padT+innerH-(scores2[i]-minS)/(maxS-minS||1)*innerH;
    pts.push({x:x,y:y,s:scores2[i]});
    linePts.push(x.toFixed(1)+','+y.toFixed(1));
  }
  var areaPath='M'+pts[0].x.toFixed(1)+','+(padT+innerH).toFixed(1)+' L'+linePts.join(' L')+' L'+pts[pts.length-1].x.toFixed(1)+','+(padT+innerH).toFixed(1)+' Z';
  h+='<path class="growth-area" d="'+areaPath+'"/>';
  h+='<polyline class="growth-line" points="'+linePts.join(' ')+'"/>';
  for(var j=0;j<pts.length;j++){h+='<circle class="growth-dot" cx="'+pts[j].x.toFixed(1)+'" cy="'+pts[j].y.toFixed(1)+'" r="3"/>';}
  h+='</svg>';
  return h;
}

function drawRadarOnCanvas(ctx,cx,cy,r,values,labels,color,textColor,borderColor){
  var N=values.length;
  var angleStep=(Math.PI*2)/N;
  for(var ring=1;ring<=4;ring++){
    var rr=r*ring/4;
    ctx.beginPath();
    for(var i=0;i<N;i++){
      var ang=-Math.PI/2+i*angleStep;
      var x=cx+Math.cos(ang)*rr;
      var y=cy+Math.sin(ang)*rr;
      if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle=borderColor;
    ctx.lineWidth=1;
    ctx.stroke();
  }
  for(var i2=0;i2<N;i2++){
    var a=-Math.PI/2+i2*angleStep;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);
    ctx.strokeStyle=borderColor;
    ctx.stroke();
    var lx=cx+Math.cos(a)*(r+15);
    var ly=cy+Math.sin(a)*(r+15);
    ctx.fillStyle=textColor;
    ctx.font='10px "JetBrains Mono", monospace';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText(labels[i2],lx,ly);
  }
  ctx.textAlign='left';
  ctx.textBaseline='alphabetic';
  ctx.beginPath();
  for(var j=0;j<N;j++){
    var vv=Math.max(0,Math.min(100,values[j]));
    var ang2=-Math.PI/2+j*angleStep;
    var rr2=r*vv/100;
    var x2=cx+Math.cos(ang2)*rr2;
    var y2=cy+Math.sin(ang2)*rr2;
    if(j===0)ctx.moveTo(x2,y2);else ctx.lineTo(x2,y2);
  }
  ctx.closePath();
  ctx.fillStyle=color;
  ctx.globalAlpha=0.15;
  ctx.fill();
  ctx.globalAlpha=1;
  ctx.strokeStyle=color;
  ctx.lineWidth=2;
  ctx.stroke();
  for(var k=0;k<N;k++){
    var vv2=Math.max(0,Math.min(100,values[k]));
    var ang3=-Math.PI/2+k*angleStep;
    var rr3=r*vv2/100;
    var x3=cx+Math.cos(ang3)*rr3;
    var y3=cy+Math.sin(ang3)*rr3;
    ctx.beginPath();
    ctx.arc(x3,y3,3,0,Math.PI*2);
    ctx.fillStyle=color;
    ctx.fill();
  }
}
function generateShareCard(userInfo,scores){
  if(!scores||scores.length===0){showToast(t('lbEmpty'));return;}

  var rounds=scores.length;
  var allGroups=cloudLeaderboardCache?groupByUser(cloudLeaderboardCache):[];
  var totalGroups=allGroups.length;
  var myIndex=-1;
  for(var k=0;k<allGroups.length;k++){if(allGroups[k].userId===userInfo.id){myIndex=k;break;}}

  var isAdmin=!!userInfo.is_admin;
  var W=720,H=600;

  ctx.fillStyle=c.bg;

  ctx.lineWidth=1;

  for(var gy=0;gy<H;gy+=24){ctx.beginPath();ctx.moveTo(0,gy);ctx.lineTo(W,gy);ctx.stroke();}

    grad.addColorStop(1,'rgba(0,255,255,0)');
  }
  ctx.fillStyle=grad;
  ctx.beginPath();
  ctx.moveTo(W,0);ctx.lineTo(W-340,0);ctx.lineTo(W,340);ctx.closePath();
  ctx.fill();

  if(isAdmin){
    ctx.strokeStyle=c.accent;
    ctx.lineWidth=3;
    ctx.strokeRect(1.5,1.5,W-3,H-3);
  }

  ctx.fillStyle=c.accent;
  ctx.fillRect(0,0,isAdmin?6:4,H);

  ctx.textBaseline='alphabetic';
  ctx.textAlign='left';
  ctx.fillStyle=c.text;
  ctx.font='700 20px "JetBrains Mono","SF Mono",Consolas,monospace';
  var brand1='Jun';

  ctx.fillStyle=c.text;

  ctx.fillStyle=c.text3;
  ctx.font='10px "JetBrains Mono", monospace';
  ctx.fillText('COMPREHENSIVE REACTION TEST',36,66);

  if(isAdmin){
    ctx.font='700 11px "JetBrains Mono", monospace';
    var adminTag='ADMINISTRATOR';

    var tagH=24;

    ctx.moveTo(tagLeft,tagTop);
    ctx.lineTo(tagRight-10,tagTop);
    ctx.lineTo(tagRight,tagTop+tagH/2);
    ctx.lineTo(tagRight-10,tagTop+tagH);
    ctx.lineTo(tagLeft,tagTop+tagH);
    ctx.closePath();
    ctx.fill();

  }

  ctx.strokeStyle=c.border;
  ctx.beginPath();ctx.moveTo(36,88);ctx.lineTo(W-36,88);ctx.stroke();

  var avatarCx=80;
  var avatarCy=155;
  var avatarR=44;
  var initial=(userInfo.name||'?').charAt(0).toUpperCase();

  if(isAdmin){
    var glow=ctx.createRadialGradient(avatarCx,avatarCy,avatarR-6,avatarCx,avatarCy,avatarR+18);
    glow.addColorStop(0,isLight?'rgba(124,58,237,.30)':'rgba(168,85,247,.40)');
    glow.addColorStop(1,'rgba(168,85,247,0)');
    ctx.fillStyle=glow;
    ctx.beginPath();ctx.arc(avatarCx,avatarCy,avatarR+18,0,Math.PI*2);ctx.fill();
  }

  ctx.fillStyle=isAdmin?(isLight?'#ede9fe':'rgba(168,85,247,.20)'):(isLight?'#e6f5f7':'#0d1618');
  ctx.beginPath();ctx.arc(avatarCx,avatarCy,avatarR,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=c.accent;
  ctx.lineWidth=isAdmin?3:2;
  ctx.beginPath();ctx.arc(avatarCx,avatarCy,avatarR,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle=isAdmin?(isLight?'#6d28d9':'#c084fc'):c.accent;
  ctx.font='700 36px "JetBrains Mono", monospace';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(initial,avatarCx,avatarCy+1);
  ctx.textAlign='left';
  ctx.textBaseline='alphabetic';

  var nameX=avatarCx+avatarR+20;
  var name=userInfo.name||'';
  ctx.fillStyle=c.text;
  ctx.font='700 28px "JetBrains Mono", monospace';
  ctx.fillText(name,nameX,avatarCy-8);
  var nameW=ctx.measureText(name).width;

  if(isAdmin){
    var bH=28;
    var bY=avatarCy-8-bH+3;
    ctx.font='700 13px "JetBrains Mono", monospace';
    var bTxt='★ ADMIN';
    var bTW=ctx.measureText(bTxt).width;
    var bW=bTW+22;
    var bX=nameX+nameW+14;
    ctx.fillStyle=c.accent;
    ctx.fillRect(bX,bY,bW,bH);
    ctx.strokeStyle='#ffffff';
    ctx.lineWidth=1.5;
    ctx.strokeRect(bX+0.75,bY+0.75,bW-1.5,bH-1.5);
    ctx.fillStyle='#ffffff';
    ctx.textBaseline='middle';
    ctx.fillText(bTxt,bX+11,bY+bH/2+0.5);
    ctx.textBaseline='alphabetic';
  }

  ctx.fillStyle=c.text3;
  ctx.font='13px "JetBrains Mono", monospace';
  ctx.fillText('#'+(userInfo.id||''),nameX,avatarCy+18);

  var gear=(userInfo.mouse||'')+(userInfo.mouse&&userInfo.keyboard?' · ':'')+(userInfo.keyboard||'');
  if(gear){
    ctx.fillStyle=c.text3;
    ctx.font='11px "JetBrains Mono", monospace';
    ctx.fillText(gear.slice(0,52),nameX,avatarCy+40);
  }

  ctx.strokeStyle=c.border;
  ctx.beginPath();ctx.moveTo(36,218);ctx.lineTo(W-36,218);ctx.stroke();

  var radarKeys=['reaction','aim','sequence','number','color','typing','chase','sound'];
  var radarLabels=['反应','瞄准','序列','记忆','色觉','打字','追踪','听觉'];
  var radarVals=radarKeys.map(function(k){var v=getProjectScore(best,k);return v===null?0:v;});
  drawRadarOnCanvas(ctx,190,354,100,radarVals,radarLabels,c.accent,c.text3,c.border);

  ctx.textAlign='right';
  ctx.fillStyle=c.grade;
  ctx.font='700 96px "JetBrains Mono", monospace';
  ctx.fillText(String(best.score),W-36,360);
  ctx.fillStyle=c.text3;
  ctx.font='11px "JetBrains Mono", monospace';
  ctx.fillText('SCORE',W-40,386);

  ctx.fillStyle=c.grade;
  ctx.font='700 56px "JetBrains Mono", monospace';
  ctx.fillText(best.rank,W-36,455);
  ctx.fillStyle=c.text3;
  ctx.font='11px "JetBrains Mono", monospace';
  ctx.fillText('GRADE',W-40,478);
  ctx.textAlign='left';

  ctx.strokeStyle=c.border;
  ctx.beginPath();ctx.moveTo(36,500);ctx.lineTo(W-36,500);ctx.stroke();

  var statY=535;
  var stats=[
    {label:'BEST',value:String(best.score)},
    {label:'AVG',value:String(avg)},
    {label:'ROUNDS',value:String(rounds)}
  ];
  var colW=(W-72)/4;
  for(var si=0;si<stats.length;si++){
    var sx=36+si*colW;
    ctx.fillStyle=c.text3;
    ctx.font='10px "JetBrains Mono", monospace';
    ctx.fillText(stats[si].label,sx,statY);
    ctx.fillStyle=c.text;
    ctx.font='700 20px "JetBrains Mono", monospace';
    ctx.fillText(stats[si].value,sx,statY+24);
  }
  var bx=36+3*colW;
  ctx.fillStyle=c.text3;
  ctx.font='10px "JetBrains Mono", monospace';
  ctx.fillText('BEAT',bx,statY);
  ctx.fillStyle=c.accent;
  ctx.font='700 20px "JetBrains Mono", monospace';
  ctx.fillText(beat+'%',bx,statY+24);

  ctx.fillStyle=c.accent;
  ctx.fillRect(0,H-3,W,3);

  var dataUrl=canvas.toDataURL('image/png');
  modalBox.innerHTML='<div class="modal-title"><span>'+t('pfShare')+'</span><button class="profile-close" onclick="closeModal()">'+t('pfClose')+'</button></div>'+
    '<div class="modal-hint" style="margin-bottom:12px">右键图片保存，或长按保存</div>'+
    '<img class="share-card-canvas" src="'+dataUrl+'" style="width:100%;max-width:720px;display:block">'+
    '<div class="modal-actions"><button class="btn btn-primary" id="btnShareDownload" type="button">'+t('pfSave')+' PNG</button></div>';
  document.getElementById('btnShareDownload').addEventListener('click',function(){
    var a=document.createElement('a');
    a.href=dataUrl;
    a.download='juntea_'+(userInfo.name||'user')+'_'+best.score+'.png';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
  });
}
function openSelfProfile(){if(!currentUser){return;}openProfile(currentUser.id);}
modalOverlay.addEventListener('click',function(e){if(e.target===modalOverlay)closeModal();});

function initUI(){
  brandEl.innerHTML=renderBrand(CONFIG.brandName);brandMeta.textContent=CONFIG.brandMeta;
  GRADES=parseGrades(CONFIG.gradeLines);
  loginBrand.innerHTML=renderBrand(CONFIG.brandName);
  applyLang();
  var u=loadCurrentUser();if(u&&u.name){currentUser=u;enterMain();}else renderLogin();
}
(function(){
  var cb=document.getElementById('adminModeCheck');
  var box=document.getElementById('adminBox');
  var icon=document.getElementById('adminStarIcon');
  var label=document.getElementById('adminModeLabel');
  var text=document.getElementById('adminModeText');
  if(!cb||!box||!icon||!label||!text)return;
  cb.addEventListener('change',function(){
    if(cb.checked){icon.style.opacity='1';box.style.borderColor='var(--purple)';box.style.background='var(--purple-soft)';label.style.borderColor='var(--purple)';label.style.background='var(--purple-soft2)';text.style.color='var(--purple-light)';}
    else{icon.style.opacity='0';box.style.borderColor='var(--text-6)';box.style.background='var(--input-bg)';label.style.borderColor='var(--border-2)';label.style.background='var(--input-bg)';text.style.color='var(--text-3)';}
  });
})();

initUI();
</script>
</body>
</html>
