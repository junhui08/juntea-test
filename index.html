<!DOCTYPE html>
<html lang="zh-CN" data-skin="a">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Jun.Tea · 综合反应测试</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.lb-like-btn{
  display:inline-flex;align-items:center;gap:3px;
  padding:2px 8px;margin-left:6px;
  border:1px solid var(--border-2);background:var(--panel);
  color:var(--text-3);font-family:inherit;font-size:11px;
  cursor:pointer;border-radius:999px;line-height:1.5;
  transition:all .15s;flex:none;
}
.lb-like-btn:hover{color:var(--bad);border-color:var(--bad)}
.lb-like-btn.liked{color:var(--bad);border-color:var(--bad);background:rgba(255,82,82,.08)}
.lb-like-btn .heart{font-size:12px;line-height:1;display:inline-block}
.lb-like-btn.liked .heart{animation:heart-pop .35s ease}
@keyframes heart-pop{0%{transform:scale(1)}50%{transform:scale(1.4)}100%{transform:scale(1)}}

.profile-like-btn{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 16px;margin-top:8px;
  border:1px solid var(--border-2);background:var(--panel);
  color:var(--text-2);font-family:inherit;font-size:13px;
  cursor:pointer;border-radius:999px;transition:all .15s;
}
.profile-like-btn:hover{color:var(--bad);border-color:var(--bad)}
.profile-like-btn.liked{color:var(--bad);border-color:var(--bad);background:rgba(255,82,82,.08)}
.profile-like-btn .heart{font-size:16px;line-height:1}
.profile-like-self{
.profile-header .profile-like-btn,
.profile-header .profile-like-self{margin-top:0;align-self:center}
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 16px;margin-top:8px;color:var(--bad);font-size:13px;
  border:1px dashed var(--border-2);border-radius:999px;
}
:root{
  --bg:#0a0a0a;--panel:#111;--panel-2:#0d0d0d;--panel-3:#1a1a1a;
  --border:#1e1e1e;--border-2:#262626;
  --text:#e8e8e8;--text-2:#aaa;--text-3:#888;--text-4:#666;--text-5:#555;--text-6:#444;--text-7:#333;
  --accent:#00ffff;--accent-hover:#00cccc;--accent-dark:#00a0a0;--accent-bg:#001a1f;--accent-soft:#0d1618;
  --purple:#a855f7;--purple-light:#c084fc;--purple-soft:rgba(168,85,247,.08);--purple-soft2:rgba(168,85,247,.06);
  --good:#00d000;--bad:#ff5252;--warn:#ff9f43;--hover:#131313;--hover2:#222;--ts:#4a7a7a;
  --input-bg:#0a0a0a;--shadow:rgba(0,0,0,.88);
  --radius:0px;--radius-sm:0px;
  --font-main:"JetBrains Mono","SF Mono",Consolas,"Courier New",monospace;
  --body-letter:.02em;
}
html[data-skin="day"]{
  --bg:#f2f3f5;--panel:#ffffff;--panel-2:#fafbfc;--panel-3:#eef0f3;
  --border:#e0e3e8;--border-2:#cbd0d7;
  --text:#1a1d23;--text-2:#4a5058;--text-3:#6b7280;--text-4:#8a9098;--text-5:#9aa3ad;--text-6:#aab3bd;--text-7:#c0c6ce;
  --accent:#0099aa;--accent-hover:#00808f;--accent-dark:#00808f;--accent-bg:#ffffff;--accent-soft:#e6f5f7;
  --purple:#7c3aed;--purple-light:#6d28d9;--purple-soft:rgba(124,58,237,.08);--purple-soft2:rgba(124,58,237,.06);
  --good:#16a34a;--bad:#dc2626;--warn:#ea580c;--hover:#f6f7f9;--hover2:#eef0f3;--ts:#7a95a0;
  --input-bg:#ffffff;--shadow:rgba(30,30,40,.28);
  --radius:0px;--radius-sm:0px;
  --font-main:"JetBrains Mono","SF Mono",Consolas,"Courier New",monospace;
  --body-letter:.02em;
}
html[data-skin="a"]{
  --bg:#0b0b0d;--panel:#141416;--panel-2:#18181b;--panel-3:#1c1c20;
  --border:rgba(255,255,255,.06);--border-2:rgba(255,255,255,.1);
  --text:#f0f0f2;--text-2:#a1a1aa;--text-3:#71717a;--text-4:#52525b;--text-5:#3f3f46;--text-6:#333338;--text-7:#27272a;
  --accent:#22d3ee;--accent-hover:#06b6d4;--accent-dark:#0891b2;--accent-bg:#03191d;--accent-soft:#0d2126;
  --purple:#a855f7;--purple-light:#c084fc;--purple-soft:rgba(168,85,247,.1);--purple-soft2:rgba(168,85,247,.06);
  --good:#22c55e;--bad:#f43f5e;--warn:#f59e0b;--hover:#1c1c20;--hover2:#26262b;--ts:#4a6b75;
  --input-bg:#0b0b0d;--shadow:rgba(0,0,0,.72);
  --radius:14px;--radius-sm:9px;
  --font-main:-apple-system,"SF Pro Display","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --body-letter:0;
}
html[data-skin="a"] body{font-family:var(--font-main);letter-spacing:0}
html[data-skin="a"] .card,
html[data-skin="a"] .summary,
html[data-skin="a"] .test-area,
html[data-skin="a"] .leaderboard-section,
html[data-skin="a"] .modal,
html[data-skin="a"] .login-box,
html[data-skin="a"] .radar-wrap,
html[data-skin="a"] .growth-wrap{border-radius:var(--radius);overflow:hidden}
html[data-skin="a"] .card{padding:22px;transition:all .2s ease}
html[data-skin="a"] .card:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,0,0,.4)}
html[data-skin="a"] .btn,
html[data-skin="a"] .login-btn,
html[data-skin="a"] .theme-btn,
html[data-skin="a"] .logout-btn,
html[data-skin="a"] .lb-fbtn,
html[data-skin="a"] .tab-btn,
html[data-skin="a"] .login-corner-btn,
html[data-skin="a"] .skin-btn,
html[data-skin="a"] .lb-refresh-btn{border-radius:var(--radius-sm)}
html[data-skin="a"] .login-field input,
html[data-skin="a"] .num-input,
html[data-skin="a"] .typing-input,
html[data-skin="a"] .profile-edit-input,
html[data-skin="a"] .profile-edit-textarea,
html[data-skin="a"] .modal-field input,
html[data-skin="a"] .modal-field textarea,
html[data-skin="a"] .lb-fsel,
html[data-skin="a"] .lb-fdrop-btn{border-radius:var(--radius-sm)}
html[data-skin="a"] .user-chip,
html[data-skin="a"] .card-tag,
html[data-skin="a"] .lb-mob,
html[data-skin="a"] .lb-name .cnt,
html[data-skin="a"] .skin-menu,
html[data-skin="a"] .lang-menu{border-radius:var(--radius-sm);overflow:hidden}
html[data-skin="a"] .card-score{font-size:38px;letter-spacing:-.03em}
html[data-skin="a"] .summary-total{letter-spacing:-.04em}
html[data-skin="b"]{
  --bg:#08080c;--panel:rgba(255,255,255,.045);--panel-2:rgba(255,255,255,.03);--panel-3:rgba(255,255,255,.07);
  --border:rgba(255,255,255,.08);--border-2:rgba(255,255,255,.13);
  --text:#e8e8ea;--text-2:#b8b8bd;--text-3:#8a8a92;--text-4:#6b6b73;--text-5:#4e4e56;--text-6:#3a3a42;--text-7:#2a2a32;
  --accent:#c084fc;--accent-hover:#a855f7;--accent-dark:#7c3aed;--accent-bg:#1a0d2a;--accent-soft:rgba(168,85,247,.12);
  --purple:#c084fc;--purple-light:#e9d5ff;--purple-soft:rgba(168,85,247,.14);--purple-soft2:rgba(168,85,247,.08);
  --good:#34d399;--bad:#fb7185;--warn:#fbbf24;--hover:rgba(255,255,255,.05);--hover2:rgba(255,255,255,.09);--ts:#7c6b9a;
  --input-bg:rgba(255,255,255,.04);--shadow:rgba(0,0,0,.9);
  --radius:18px;--radius-sm:12px;
  --font-main:-apple-system,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;
  --body-letter:0;
}
html[data-skin="b"] body{font-family:var(--font-main);letter-spacing:0;position:relative;overflow-x:hidden}
html[data-skin="b"] body::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 60% at 20% 10%, rgba(88,28,135,.35) 0%, transparent 55%),
    radial-gradient(ellipse 70% 55% at 80% 30%, rgba(6,182,212,.25) 0%, transparent 55%),
    radial-gradient(ellipse 90% 60% at 50% 100%, rgba(236,72,153,.15) 0%, transparent 60%);
}
html[data-skin="b"] .card,
html[data-skin="b"] .summary,
html[data-skin="b"] .test-area,
html[data-skin="b"] .leaderboard-section,
html[data-skin="b"] .modal,
html[data-skin="b"] .login-box,
html[data-skin="b"] .lb-history-item,
html[data-skin="b"] .profile-history-item,
html[data-skin="b"] .user-chip,
html[data-skin="b"] .theme-btn,
html[data-skin="b"] .logout-btn,
html[data-skin="b"] .lang-menu,
html[data-skin="b"] .skin-menu,
html[data-skin="b"] .skin-btn,
html[data-skin="b"] .mobile-tip,
html[data-skin="b"] .radar-wrap,
html[data-skin="b"] .growth-wrap{
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
}
html[data-skin="b"] .card,
html[data-skin="b"] .summary,
html[data-skin="b"] .test-area,
html[data-skin="b"] .leaderboard-section,
html[data-skin="b"] .modal,
html[data-skin="b"] .login-box,
html[data-skin="b"] .radar-wrap,
html[data-skin="b"] .growth-wrap{border-radius:var(--radius);overflow:hidden}
html[data-skin="b"] .btn,
html[data-skin="b"] .login-btn,
html[data-skin="b"] .theme-btn,
html[data-skin="b"] .logout-btn,
html[data-skin="b"] .lb-fbtn,
html[data-skin="b"] .tab-btn,
html[data-skin="b"] .login-corner-btn,
html[data-skin="b"] .skin-btn{border-radius:var(--radius-sm)}
html[data-skin="b"] .login-field input,
html[data-skin="b"] .num-input,
html[data-skin="b"] .typing-input,
html[data-skin="b"] .profile-edit-input,
html[data-skin="b"] .profile-edit-textarea,
html[data-skin="b"] .modal-field input,
html[data-skin="b"] .modal-field textarea{border-radius:var(--radius-sm)}
html[data-skin="b"] .user-chip,
html[data-skin="b"] .card-tag,
html[data-skin="b"] .lb-mob,
html[data-skin="b"] .lb-name .cnt{border-radius:99px}
html[data-skin="b"] .card-score,
html[data-skin="b"] .summary-total{
  background:linear-gradient(135deg,#c084fc,#67e8f9);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
}
html[data-skin="b"] .card-score .u,
html[data-skin="b"] .summary-total .u{-webkit-text-fill-color:var(--text-5)}
html[data-skin="d"]{
  --bg:#0a1410;--panel:rgba(74,222,128,.02);--panel-2:rgba(74,222,128,.04);--panel-3:rgba(74,222,128,.06);
  --border:#166534;--border-2:#15803d;
  --text:#4ade80;--text-2:#86efac;--text-3:#4ade80;--text-4:#22c55e;--text-5:#166534;--text-6:#14532d;--text-7:#0f3d24;
  --accent:#4ade80;--accent-hover:#22c55e;--accent-dark:#16a34a;--accent-bg:#0a1410;--accent-soft:rgba(74,222,128,.06);
  --purple:#fbbf24;--purple-light:#fcd34d;--purple-soft:rgba(251,191,36,.08);--purple-soft2:rgba(251,191,36,.05);
  --good:#4ade80;--bad:#f87171;--warn:#fbbf24;--hover:rgba(74,222,128,.08);--hover2:rgba(74,222,128,.12);--ts:#166534;
  --input-bg:#0a1410;--shadow:rgba(0,0,0,.9);
  --radius:0px;--radius-sm:0px;
  --font-main:"JetBrains Mono","SF Mono",Consolas,monospace;
  --body-letter:.02em;
}
html[data-skin="d"] body{font-family:var(--font-main);letter-spacing:.02em;position:relative}
html[data-skin="d"] body::after{
  content:'';position:fixed;inset:0;z-index:9998;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0px,rgba(0,0,0,0) 2px,rgba(0,0,0,.15) 2px,rgba(0,0,0,.15) 3px);
}
html[data-skin="d"] .card,
html[data-skin="d"] .summary,
html[data-skin="d"] .test-area,
html[data-skin="d"] .leaderboard-section,
html[data-skin="d"] .modal,
html[data-skin="d"] .login-box,
html[data-skin="d"] .radar-wrap,
html[data-skin="d"] .growth-wrap{
  border:1px solid #4ade80;
  box-shadow:0 0 20px rgba(74,222,128,.15),inset 0 0 20px rgba(74,222,128,.05);
}
html[data-skin="d"] .brand{border:1px solid #4ade80;padding:14px 16px;margin-bottom:24px}
html[data-skin="d"] .card-score{text-shadow:0 0 10px rgba(74,222,128,.7)}
html[data-skin="d"] .summary-total{text-shadow:0 0 14px rgba(74,222,128,.7)}
html[data-skin="d"] .view-title::before{content:'> ';color:#fbbf24}
html[data-skin="d"] .btn{background:#4ade80;color:#0a1410;border:1px solid #4ade80}
html[data-skin="d"] .btn.btn-primary{background:#4ade80;color:#0a1410}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--font-main);background:var(--bg);color:var(--text);
  min-height:100vh;padding:24px 16px;user-select:none;-webkit-user-select:none;
  letter-spacing:var(--body-letter);display:flex;justify-content:center;align-items:flex-start;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  transition:background .2s,color .2s;
}
.container{width:100%;max-width:960px}
.brand-bar{display:flex;justify-content:space-between;align-items:center;padding:0 4px 14px;border-bottom:1px solid var(--border);margin-bottom:16px;gap:12px;flex-wrap:wrap}
.brand{font-size:14px;font-weight:700;letter-spacing:.15em;cursor:pointer}
.brand .dot{color:var(--accent)}
.brand-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:relative}
.brand-meta{font-size:11px;color:var(--text-5);letter-spacing:.1em}
.theme-btn,.skin-btn{
  padding:0 12px;border:1px solid var(--border-2);background:var(--panel);color:var(--text-2);
  font-family:inherit;font-size:12px;cursor:pointer;height:28px;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
}
.theme-btn:hover,.skin-btn:hover{color:var(--accent);border-color:var(--accent-dark)}
.skin-btn .caret{font-size:9px;opacity:.7}
.user-chip{display:inline-flex;align-items:center;gap:6px;padding:0 10px;border:1px solid var(--border);background:var(--panel-2);font-size:11px;letter-spacing:.1em;color:var(--text-2);height:28px;line-height:1}
.user-chip.admin{border-color:var(--purple);background:var(--purple-soft);color:var(--purple-light)}
.user-chip .star{color:var(--purple);font-size:11px;line-height:1}
.user-chip .uid{color:var(--text-4);font-size:10px}
.user-chip.admin .uid{color:var(--purple)}
.logout-btn{padding:0 12px;border:1px solid var(--border-2);background:var(--panel);color:var(--text-3);font-family:inherit;font-size:11px;cursor:pointer;height:28px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.logout-btn:hover{color:var(--bad);border-color:var(--bad)}
.mobile-tip{display:none;padding:14px 16px;background:rgba(255,159,67,.08);border:1px solid #3a2a10;color:var(--warn);font-size:12px;margin-bottom:16px;line-height:1.7}
.mobile-tip b{color:var(--warn)}
.login-wrap{display:flex;justify-content:center;align-items:center;min-height:70vh;width:100%}
.login-box{width:100%;max-width:460px;background:var(--panel);border:1px solid var(--border);position:relative}
.login-brand{text-align:center;font-size:20px;font-weight:700;letter-spacing:.25em;padding:32px 32px 6px 32px}
.login-brand .dot{color:var(--accent)}
.login-sub{text-align:center;font-size:11px;color:var(--text-5);letter-spacing:.2em;margin-bottom:24px}
.login-tabs{display:flex;background:var(--panel-2);border-bottom:1px solid var(--border)}
.login-tab{flex:1;padding:14px;background:transparent;border:none;color:var(--text-4);font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.2em;cursor:pointer;position:relative}
.login-tab:hover{color:var(--text-2)}
.login-tab.active{color:var(--accent)}
.login-tab.active::after{content:'';position:absolute;bottom:-1px;left:20%;right:20%;height:2px;background:var(--accent)}
.login-panel{padding:28px 32px 56px 32px}
.login-panel.admin-mode{background:linear-gradient(180deg,var(--purple-soft) 0%,transparent 100%);border-top:2px solid var(--purple)}
.admin-badge{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;background:var(--purple-soft);border:1px solid var(--purple);margin-bottom:20px;font-size:11px;font-weight:700;letter-spacing:.25em;color:var(--purple-light)}
.login-field{margin-bottom:16px}
.login-field label{display:block;font-size:11px;color:var(--text-4);letter-spacing:.15em;margin-bottom:8px}
.login-field input{width:100%;padding:13px 14px;background:var(--input-bg);border:1px solid var(--border-2);color:var(--text);font-family:inherit;font-size:14px;outline:none;text-transform:uppercase;-webkit-appearance:none}
.login-field input.pwd{text-transform:none}
.login-field input:focus{border-color:var(--accent)}
.login-panel.admin-mode .login-field input:focus{border-color:var(--purple)}
.login-error{font-size:12px;color:var(--bad);min-height:18px;margin-bottom:10px;line-height:1.5}
.login-btns{display:flex;gap:8px;margin-top:8px}
.login-btn{flex:1;padding:14px;background:var(--accent);color:var(--accent-bg);border:1px solid var(--accent);font-family:inherit;font-size:14px;font-weight:700;letter-spacing:.2em;cursor:pointer}
.login-btn:hover{background:var(--accent-hover)}
.login-btn:disabled{opacity:.5;cursor:not-allowed}
.login-btn.admin{background:var(--purple);color:#fff;border-color:var(--purple)}
.login-hint{font-size:10px;color:var(--text-5);text-align:center;margin-top:20px;line-height:1.9}
.login-corner{position:absolute;bottom:12px;right:12px;display:flex;gap:6px;z-index:100}
.login-corner-btn{padding:6px 12px;border:1px solid var(--border-2);background:var(--panel);color:var(--text-2);font-family:inherit;font-size:12px;cursor:pointer;line-height:1.4;min-width:44px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.login-corner-btn:hover{color:var(--accent);border-color:var(--accent-dark)}
.lang-menu,.skin-menu{position:absolute;bottom:52px;right:12px;background:var(--panel);border:1px solid var(--border-2);z-index:101;min-width:170px;box-shadow:0 6px 24px var(--shadow)}
.skin-menu{min-width:190px}
.lang-menu-item,.skin-menu-item{padding:10px 16px;font-size:13px;cursor:pointer;color:var(--text-2);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px}
.lang-menu-item:last-child,.skin-menu-item:last-child{border-bottom:none}
.lang-menu-item:hover,.skin-menu-item:hover{background:var(--hover);color:var(--accent)}
.lang-menu-item.active,.skin-menu-item.active{color:var(--accent);background:var(--accent-soft)}
.lang-menu-item .check,.skin-menu-item .check{font-size:11px;opacity:0}
.lang-menu-item.active .check,.skin-menu-item.active .check{opacity:1}
.view-title{font-size:14px;font-weight:700;letter-spacing:.2em;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.view-title .sub{font-size:11px;color:var(--text-4);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--border);padding:18px;cursor:pointer}
@keyframes card-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.card:hover{border-color:var(--accent)}
.card.done{border-color:var(--accent-dark);background:var(--accent-soft)}
.card.expired{border-color:#3a1010}
html[data-skin="day"] .card.expired{border-color:#f5c2c2}
.card-name{font-size:14px;font-weight:700;letter-spacing:.1em;margin-bottom:6px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card-desc{font-size:11px;color:var(--text-4);line-height:1.5;margin-bottom:12px;min-height:32px}
.card-score{font-size:32px;font-weight:800;line-height:1}
.card-score .u{font-size:12px;color:var(--text-5);margin-left:4px}
.card-foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px;font-size:10px;color:var(--text-5)}
.card-tag{font-size:9px;padding:2px 6px;border:1px solid var(--border-2);color:var(--text-4)}
.card-tag.done{color:var(--accent);border-color:var(--accent-dark)}
.card-tag.expired{color:var(--bad);border-color:#3a1010}
.card-tag.new{color:var(--text-3);border-color:var(--border-2);background:var(--panel-3)}

/* ============================================================
   主题系统
   ============================================================ */
var SKIN_KEY='juntea_skin_v2';
var SKIN_ORDER=['day','night','a','b','d'];
var SKIN_LABEL={
  zh:{day:'日间',night:'夜间',a:'现代',b:'玻璃',d:'终端'},
  en:{day:'Light',night:'Dark',a:'Modern',b:'Glass',d:'Retro'},
  ja:{day:'ライト',night:'ダーク',a:'モダン',b:'グラス',d:'レトロ'},
  ko:{day:'라이트',night:'다크',a:'모던',b:'글래스',d:'레트로'}
};
var SKIN='a';
function applySkin(code){
  if(SKIN_ORDER.indexOf(code)<0)code='a';
  SKIN=code;
  document.documentElement.setAttribute('data-skin',code);
  var items=document.querySelectorAll('.skin-menu-item');
  for(var i=0;i<items.length;i++){
    if(items[i].getAttribute('data-skin')===code)items[i].classList.add('active');
    else items[i].classList.remove('active');
  }
  var lbl=(SKIN_LABEL[LANG]&&SKIN_LABEL[LANG][code])||SKIN_LABEL.zh[code];
  var t1=document.getElementById('skinBtnLoginText');if(t1)t1.textContent=lbl;
  var t2=document.getElementById('skinBtnMainText');if(t2)t2.textContent=lbl;
  var meta=document.querySelector('meta[name="theme-color"]');
  if(meta){meta.setAttribute('content',code==='day'?'#f2f3f5':'#0a0a0a');}
}
function initSkin(){
  var s='a';
  try{var r=localStorage.getItem(SKIN_KEY);if(SKIN_ORDER.indexOf(r)>=0)s=r;}catch(e){}
  applySkin(s);
}
function setSkin(code){
  if(SKIN_ORDER.indexOf(code)<0)return;
  try{localStorage.setItem(SKIN_KEY,code);}catch(e){}
  applySkin(code);
  hideSkinMenus();
}
function hideSkinMenus(){
  var m1=document.getElementById('skinMenuLogin');if(m1)m1.style.display='none';
  var m2=document.getElementById('skinMenuMain');if(m2)m2.style.display='none';
}
function toggleSkinMenu(id){
  var m=document.getElementById(id);if(!m)return;
  var open=m.style.display==='block';
  hideSkinMenus();
  hideLangMenu();hideLangMenuMain();
  m.style.display=open?'none':'block';
}

/* ============================================================
   音频
   ============================================================ */
var _audioCtx=null;
function ensureAudio(){if(!_audioCtx){try{_audioCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(_audioCtx&&_audioCtx.state==='suspended')_audioCtx.resume();}
function playBeep(freq,dur,type,vol){
  ensureAudio();if(!_audioCtx)return;
  var o=_audioCtx.createOscillator(),g=_audioCtx.createGain();
  o.type=type||'square';o.frequency.value=freq||800;
  g.gain.setValueAtTime(vol||0.08,_audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,_audioCtx.currentTime+(dur||0.06));
  o.connect(g);g.connect(_audioCtx.destination);
  o.start();o.stop(_audioCtx.currentTime+(dur||0.06));
}
function sfxClick(){playBeep(1200,0.03,'square',0.05);}
function sfxDone(){playBeep(600,0.08,'square',0.06);setTimeout(function(){playBeep(900,0.08,'square',0.06);},90);}
function sfxBest(){playBeep(1000,0.06,'square',0.08);setTimeout(function(){playBeep(1300,0.06,'square',0.08);},80);setTimeout(function(){playBeep(1600,0.10,'square',0.08);},160);}
function playTone(freq,dur,when){
  ensureAudio();if(!_audioCtx)return;
  var t0=_audioCtx.currentTime+(when||0);
  var o=_audioCtx.createOscillator(),g=_audioCtx.createGain();
  o.type='sine';o.frequency.value=freq;
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(0.2,t0+0.005);
  g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g);g.connect(_audioCtx.destination);
  o.start(t0);o.stop(t0+dur+0.02);
}

function t(k){var d=I18N[LANG]||I18N.zh;if(d[k]!==undefined)return d[k];if(I18N.zh[k]!==undefined)return I18N.zh[k];return k;}
function applyLang(){
  var els=document.querySelectorAll('[data-i18n]');
  for(var i=0;i<els.length;i++){var k=els[i].getAttribute('data-i18n');if(I18N[LANG][k]!==undefined)els[i].innerHTML=I18N[LANG][k];}
  var els2=document.querySelectorAll('[data-i18n-ph]');
  for(var j=0;j<els2.length;j++){var k2=els2[j].getAttribute('data-i18n-ph');if(I18N[LANG][k2]!==undefined)els2[j].placeholder=I18N[LANG][k2];}
  var regActive=document.querySelector('.login-tab[data-tab="register"]');
  var isReg=regActive&&regActive.classList.contains('active');
  var kInput=document.getElementById('userLoginKey');
  if(kInput){kInput.placeholder=isReg?t('pwdPhReg'):t('pwdPhLogin');kInput.setAttribute('data-i18n-ph',isReg?'pwdPhReg':'pwdPhLogin');}
  var hint=document.getElementById('loginHint');
  if(hint)hint.innerHTML=isReg?t('hintReg'):t('hintLogin');
  var lb=document.getElementById('langBtnLogin');if(lb)lb.textContent=LANG_BTN_LABEL[LANG]||'CN';
  var lbm=document.getElementById('langBtnMain');if(lbm)lbm.textContent=LANG_BTN_LABEL[LANG]||'CN';
  var lm=document.querySelectorAll('#langMenu .lang-menu-item,#langMenuMain .lang-menu-item');
  for(var m=0;m<lm.length;m++){if(lm[m].getAttribute('data-lang')===LANG)lm[m].classList.add('active');else lm[m].classList.remove('active');}
  applySkin(SKIN);
  var mt=document.getElementById('mobileTip');if(mt)mt.innerHTML=t('mobileTip');
  var tfi=document.getElementById('testFootInfo');if(tfi&&currentTest)tfi.textContent=t('keyQuitHint');
  if(typeof currentUser!=='undefined'&&currentUser){
    try{renderGrid();}catch(e){}
    try{refreshLeaderboardDisplay();}catch(e){}
    try{applyLeaderboardOpenState();}catch(e){}
  }
}
function initLang(){try{var s=localStorage.getItem(LANG_KEY);if(LANG_ORDER.indexOf(s)>=0)LANG=s;}catch(e){}applyLang();}
function setLang(code){if(LANG_ORDER.indexOf(code)<0)return;LANG=code;try{localStorage.setItem(LANG_KEY,LANG);}catch(e){}applyLang();hideLangMenu();hideLangMenuMain();}
function hideLangMenu(){var m=document.getElementById('langMenu');if(m)m.style.display='none';}
function hideLangMenuMain(){var m=document.getElementById('langMenuMain');if(m)m.style.display='none';}
function toggleLangMenu(){var m=document.getElementById('langMenu');if(!m)return;var open=m.style.display==='block';hideLangMenu();hideSkinMenus();m.style.display=open?'none':'block';}
function toggleLangMenuMain(){var m=document.getElementById('langMenuMain');if(!m)return;var open=m.style.display==='block';hideLangMenuMain();hideSkinMenus();m.style.display=open?'none':'block';}

function showToast(m,d,targetId){
  var el=document.createElement('div');
  el.className='toast';
  el.textContent=m;
  el.style.opacity='0';
  var host=null;
  var anchor=null;
  if(targetId) host=document.getElementById(targetId);
  if(!host){
    var btn=document.getElementById('btnSaveTotal');
    if(btn&&btn.parentNode){ host=btn.parentNode; anchor=btn; }
  }
  if(host){
    var old=host.querySelectorAll('.toast');
    for(var oi=0;oi<old.length;oi++){
      if(old[oi].parentNode)old[oi].parentNode.removeChild(old[oi]);
    }
    if(anchor&&anchor.parentNode===host) host.insertBefore(el,anchor);
    else host.appendChild(el);
  }else{
    var oldBody=document.body.querySelectorAll('.toast');
    for(var oj=0;oj<oldBody.length;oj++){
      if(oldBody[oj].parentNode)oldBody[oj].parentNode.removeChild(oldBody[oj]);
    }
    document.body.appendChild(el);
    el.style.position='fixed';
    el.style.left='50%';
    el.style.top='24px';
    el.style.transform='translateX(-50%)';
    el.style.zIndex='99999';
    el.style.boxShadow='0 4px 24px rgba(0,0,0,.6)';
  }
  requestAnimationFrame(function(){requestAnimationFrame(function(){el.style.opacity='1';});});
  setTimeout(function(){
    el.style.opacity='0';
    setTimeout(function(){if(el.parentNode)el.parentNode.removeChild(el);},320);
  },d||1800);
}

function simpleHash(str){var h1=5381>>>0,h2=52711>>>0;for(var i=0;i<str.length;i++){var c=str.charCodeAt(i);h1=((h1*33)^c)>>>0;h2=((h2*31)+c)>>>0;}return h1.toString(16).padStart(8,'0')+h2.toString(16).padStart(8,'0');}

async function doUserRegister(){
  var _chk=document.getElementById('adminModeCheck');
  if(_chk&&_chk.checked){userLoginError.textContent=t('msgNoAdminReg');return;}
  var name=normalizeName(userLoginName.value);
  var key=userLoginKey.value.trim();
  userLoginError.textContent='';
  userLoginName.value=name;
  if(!name){userLoginError.textContent=t('msgNameOnly');userLoginName.focus();return;}
  if(name.length<2){userLoginError.textContent=t('msgNameMin');return;}
  if(!key){userLoginError.textContent=t('msgSetPwd');userLoginKey.focus();return;}
  if(key.length<4){userLoginError.textContent=t('msgPwdMin');return;}
  if(name===DEFAULT_ADMIN_NAME){userLoginError.textContent=t('msgNameTaken');return;}
  var cd=checkRegisterCooldown();
  if(!cd.ok){userLoginError.textContent=cd.msg;return;}
  var keyHash=userKeyHash(name,key);
  var checkRes=await supabase.from('users').select('*').eq('name',name).eq('key_hash',keyHash);
  if(checkRes.error){userLoginError.textContent=t('msgNetErr')+checkRes.error.message;return;}
  if(checkRes.data&&checkRes.data.length>0){userLoginError.textContent=t('msgAlreadyReg');return;}
  var newId=genUserId();
  var insRes=await supabase.from('users').insert([{id:newId,name:name,key_hash:keyHash,is_admin:false,created_ts:Date.now()}]);
  if(insRes.error){userLoginError.textContent=t('msgSaveFail')+insRes.error.message;return;}
  recordRegisterTime();
  alert(t('msgRegisterOk')+name+t('msgRegisterOk2')+newId+t('msgRegisterOk3'));
  currentUser={name:name,id:newId,isAdmin:false,loginTs:Date.now()};
  saveCurrentUser(currentUser);
  enterMain();
}

async function doUserLogin(){

  var keyHash=userKeyHash(name,key);

  currentUser={name:name,id:u.id,isAdmin:false,loginTs:Date.now()};
  saveCurrentUser(currentUser);
  enterMain();
}

function groupByUser(list){
  var map={};

    var key=item.user_id||item.id||item.name;
    if(!map[key])map[key]={userId:key,name:item.name,isAdmin:!!item.is_admin,records:[]};
    map[key].records.push(item);

  var groups=Object.keys(map).map(function(k){var g=map[k];g.records.sort(function(a,b){return b.score-a.score;});g.best=g.records[0];return g;});

async function toggleLike(targetUserId){
  var host = document.getElementById('lbToastHost') ? 'lbToastHost' : null;
  if(!currentUser){ showToast(t('msgNeedLogin'),1800,host); return; }
  if(targetUserId===currentUser.id){ showToast('不能给自己点赞',1800,host); return; }

  var already = !!myLikesSet[targetUserId];
  if(already){
    delete myLikesSet[targetUserId];
    likesCache[targetUserId] = Math.max(0,(likesCache[targetUserId]||1)-1);

    myLikesSet[targetUserId] = true;

      var r = await supabase.from('likes').delete()

    }else{

        from_user_id: currentUser.id, to_user_id: targetUserId, ts: Date.now()
      }]);
      if(r2.error) throw r2.error;

}

function loadSession(){try{var r=localStorage.getItem(CONFIG.sessionKey);return r?JSON.parse(r):{};}catch(e){return {};}}
function saveSession(s){try{localStorage.setItem(CONFIG.sessionKey,JSON.stringify(s));}catch(e){}}
function purgeExpiredSession(){var s=loadSession();var now=Date.now();var m=CONFIG.resultExpireMinutes*60*1000;var ch=false;for(var k in s){var e=s[k];if(!e||typeof e.ts!=='number'||(now-e.ts)>m){delete s[k];ch=true;}}if(ch)saveSession(s);return s;}
function recordProjectResult(key,score,data){var s=purgeExpiredSession();s[key]={score:Math.round(score),ts:Date.now(),data:data||{}};saveSession(s);}
function isExpired(e){if(!e||typeof e.ts!=='number')return true;return (Date.now()-e.ts)>CONFIG.resultExpireMinutes*60*1000;}
function remainingMinutes(e){if(!e||typeof e.ts!=='number')return 0;return Math.max(0,Math.floor(((CONFIG.resultExpireMinutes*60*1000)-(Date.now()-e.ts))/60000));}
function getEnabledProjects(){var o=[];for(var k in CONFIG.projects){if(CONFIG.projects[k]&&CONFIG.projects[k].enabled){if(IS_MOBILE&&!isProjectAvailableOnMobile(k))continue;o.push(k);}}return o;}
function computeTotal(){
  var s=purgeExpiredSession();var en=getEnabledProjects();var tw=0,ws=0;var items=[];
  en.forEach(function(k){var e=s[k],p=CONFIG.projects[k];if(e&&!isExpired(e)){ws+=e.score*p.weight;tw+=p.weight;items.push({key:k,score:e.score,weight:p.weight});}});
  var missing=[];
  REQUIRED_PROJECTS.forEach(function(k){
    if(en.indexOf(k)<0)return;
    if(!s[k]||isExpired(s[k]))missing.push(k);
  });
  var req=CONFIG.minTestsForTotal;
  if(IS_MOBILE){
    var _mobileReq=0;
    REQUIRED_PROJECTS.forEach(function(k){if(en.indexOf(k)>=0)_mobileReq++;});
    if(_mobileReq>0 && _mobileReq<req) req=_mobileReq;
  }
  if(missing.length>0){
    return{total:0,grade:'—',items:items,tested:items.length,totalCount:en.length,ready:false,required:req,need:missing.length,missingRequired:missing};
  }
  if(tw<=0||items.length<req){
    return{total:0,grade:'—',items:items,tested:items.length,totalCount:en.length,ready:false,required:req,need:Math.max(0,req-items.length),missingRequired:[]};
  }
  var total=Math.round(ws/tw);
  return{total:total,grade:getGrade(total),items:items,tested:items.length,totalCount:en.length,ready:true,required:req,need:0,missingRequired:[]};
}

/* ---------- 1. 反应时间 ---------- */
TESTS.reaction={start:function(area,finish){
  var p=CONFIG.projects.reaction;
  var state={mode:'idle',times:[],timer:null,startT:null};
  var panel=makeTestPanel('',t('tClickStart'),p.trials+' '+t('tTimesCount'));
  area.appendChild(panel);
  function clearTimer(){if(state.timer){clearTimeout(state.timer);state.timer=null;}}
  function next(){
    clearTimer();state.mode='waiting';state.startT=null;
    panel.className='test-panel w';
    panel.querySelector('.mt').textContent=t('tWaitGreen');
    panel.querySelector('.st').textContent=t('tGreenNow');
    state.timer=setTimeout(function(){
      state.timer=null;state.mode='ready';
      panel.className='test-panel r';
      panel.querySelector('.mt').textContent=t('tClickNow');
      panel.querySelector('.st').textContent='';
      state.startT=null;
      requestAnimationFrame(function(){requestAnimationFrame(function(){if(state.mode==='ready')state.startT=performance.now();});});
    },p.delayMin+Math.random()*(p.delayMax-p.delayMin));
  }
  function handler(e){
    if(e.pointerType==='mouse'&&e.button!==0)return;
    if(state.mode==='idle'){sfxClick();next();return;}
    if(state.mode==='waiting'){clearTimer();state.mode='idle';panel.className='test-panel e';panel.querySelector('.mt').textContent=t('tTooEarly');panel.querySelector('.st').textContent=t('tClickRetry');playBeep(300,0.12,'square',0.08);return;}
    if(state.mode==='ready'){
      if(state.startT===null)return;
      var tt=Math.round(performance.now()-state.startT);
      state.times.push(tt);
      if(state.times.length>=p.trials){
        var avg=state.times.reduce(function(a,b){return a+b;},0)/state.times.length;
        var score=Math.max(0,Math.min(100,100-(avg-p.speedBase)*p.speedFactor));
        state.mode='done';panel.className='test-panel s';
        panel.querySelector('.mt').textContent=t('tDone');
        var _min=Math.min.apply(null,state.times);
        panel.querySelector('.st').textContent=t('tAvg')+' '+Math.round(avg)+'ms · '+t('tBest')+' '+_min+'ms';
        sfxDone();
        state.timer=setTimeout(function(){finish(Math.round(score),{times:state.times,avg:Math.round(avg),best:_min});},1100);
        return;
      }
      state.mode='cooldown';panel.className='test-panel s';
      panel.querySelector('.mt').textContent=tt+'ms';
      panel.querySelector('.st').textContent='('+state.times.length+'/'+p.trials+')';
      playBeep(1000,0.05,'square',0.06);
      state.timer=setTimeout(next,700);
    }
  }
  panel.addEventListener('pointerdown',handler);
  currentCleanup=function(){clearTimer();panel.removeEventListener('pointerdown',handler);};
}};

TESTS.aim={start:function(area,finish){
  var p=CONFIG.projects.aim;var state={hits:0,times:[],active:null,timer:null,done:false,lastSpawn:0};
  var body=document.createElement('div');body.className='test-panel';body.style.cssText='cursor:default;padding:0;position:relative;overflow:hidden';
  var intro=document.createElement('div');intro.style.textAlign='center';intro.innerHTML='<div class="mt">'+t('tClickStart')+'</div><div class="st">'+p.targets+' '+t('tMultiTargets')+' · '+p.timeLimitSec+t('tSec')+'</div>';
  body.appendChild(intro);area.appendChild(body);
  var infoEl=document.createElement('div');infoEl.style.cssText='position:absolute;top:10px;left:14px;font-size:12px;color:var(--text-4);pointer-events:none;z-index:5';infoEl.textContent=t('tHit')+' 0 / '+p.targets;
  var timerEl=document.createElement('div');timerEl.style.cssText='position:absolute;top:10px;right:14px;font-size:12px;color:var(--accent);font-weight:700;pointer-events:none;z-index:5';timerEl.textContent=p.timeLimitSec+t('tSec');
  var startTs=null,timeLeft=p.timeLimitSec;
  function removeTarget(){if(state.active&&state.active.parentNode)state.active.parentNode.removeChild(state.active);state.active=null;}
  function spawn(){
    removeTarget();if(state.done)return;if(state.hits>=p.targets){finishRound();return;}
    var sz=p.targetSize;var tt=document.createElement('div');tt.className='aim-target';
    tt.style.width=sz+'px';tt.style.height=sz+'px';tt.style.fontSize=Math.max(10,sz/3)+'px';tt.textContent=state.hits+1;
    var w=body.clientWidth,h=body.clientHeight,pad=6;
    tt.style.left=(pad+Math.random()*Math.max(1,w-sz-pad*2))+'px';tt.style.top=(pad+Math.random()*Math.max(1,h-sz-pad*2))+'px';
    tt.addEventListener('pointerdown',function(e){
      if(e.pointerType==='mouse'&&e.button!==0)return;e.stopPropagation();
      state.times.push(performance.now()-state.lastSpawn);state.hits++;removeTarget();
      playBeep(1400,0.03,'square',0.05);
      infoEl.textContent=t('tHit')+' '+state.hits+' / '+p.targets;
      if(state.hits>=p.targets){finishRound();return;}spawn();
    });
    body.appendChild(tt);state.active=tt;state.lastSpawn=performance.now();
  }
  function finishRound(){
    if(state.done)return;state.done=true;if(state.timer)clearInterval(state.timer);removeTarget();
    var avg=state.times.length>0?state.times.reduce(function(a,b){return a+b;},0)/state.times.length:9999;
    var hr=state.hits/p.targets;var score=0;
    if(state.hits>0){var ss=Math.max(0,Math.min(100,100-(avg-p.baseMs)/8));score=Math.round(ss*0.7+hr*100*0.3);}
    body.innerHTML='<div class="mt" style="color:#fff">'+t('tDone')+' '+state.hits+' / '+p.targets+'</div><div class="st">'+t('tAvg')+' '+Math.round(avg)+'ms</div>';
    sfxDone();
    setTimeout(function(){finish(score,{hits:state.hits,avg:Math.round(avg)});},1000);
  }
  function handler(e){
    if(startTs!==null)return;if(e.pointerType==='mouse'&&e.button!==0)return;
    startTs=performance.now();state.hits=0;state.times=[];state.done=false;
    body.innerHTML='';body.appendChild(infoEl);body.appendChild(timerEl);body.style.cursor='crosshair';
    infoEl.textContent=t('tHit')+' 0 / '+p.targets;timerEl.textContent=timeLeft+t('tSec');spawn();
    state.timer=setInterval(function(){if(state.done)return;timeLeft--;timerEl.textContent=Math.max(0,timeLeft)+t('tSec');if(timeLeft<=0)finishRound();},1000);
  }
  body.addEventListener('pointerdown',handler);
  currentCleanup=function(){if(state.timer)clearInterval(state.timer);body.removeEventListener('pointerdown',handler);removeTarget();};
}};

TESTS.sequence={start:function(area,finish){
  var p=CONFIG.projects.sequence;var SIZE=4;var state={seq:[],user:[],max:0,active:false,phase:'intro'};
  var wrap=document.createElement('div');wrap.style.cssText='display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px';

  var cells=[];for(var i=0;i<SIZE*SIZE;i++){var c=document.createElement('div');c.className='seq-cell';c.style.width=cellSize+'px';c.style.height=cellSize+'px';c.dataset.i=i;cells.push(c);grid.appendChild(c);}
  wrap.appendChild(grid);area.appendChild(wrap);

    setTimeout(pn,600);
  }
  function handleClick(){

    if(n===state.seq.length){state.max=Math.max(state.max,state.seq.length);state.active=false;info.textContent=t('tCorrectNext');if(state.seq.length>=p.maxLen){finish(100,{maxSeq:state.max});return;}setTimeout(nextRound,900);}
    else info.textContent=t('tReproduce')+' ('+n+'/'+state.seq.length+')';
  }
  cells.forEach(function(c){c.addEventListener('click',handleClick);});
  currentCleanup=function(){};

TESTS.typing={start:function(area,finish){
  var p=CONFIG.projects.typing;
  var wrap=document.createElement('div');wrap.style.cssText='display:flex;flex-direction:column;align-items:center;padding:16px;width:100%';
  var info=document.createElement('div');info.style.cssText='font-size:13px;color:var(--text-3);margin-bottom:10px;text-align:center';info.textContent=t('tTypingHint')+' · '+t('tRemainSec')+' '+p.durationSec+t('tSec');
  var td=document.createElement('div');td.className='typing-text';
  var input=document.createElement('input');input.className='typing-input';input.type='text';input.autocomplete='off';input.spellcheck=false;input.style.display='none';
  var btn=document.createElement('button');btn.className='btn btn-primary';btn.style.cssText='flex:none;padding:12px 30px';btn.textContent=t('tClickStart');
  wrap.appendChild(info);wrap.appendChild(td);wrap.appendChild(input);wrap.appendChild(btn);area.appendChild(wrap);
  var startTime=null,timer=null,inputText='',done=false,sample='';
  function pickSample(){return TYPING_SAMPLES[Math.floor(Math.random()*TYPING_SAMPLES.length)];}
  function buildInitial(){sample='';while(sample.length<400)sample+=pickSample()+' ';}
  function render(){
    var h='';var startPos=Math.max(0,inputText.length-40);
    for(var i=0;i<sample.length;i++){
      if(i<startPos)continue;if(i>inputText.length+120)break;
      var ch=sample[i],ce=escapeHtml(ch);
      if(i<inputText.length){if(inputText[i]===ch)h+='<span class="ok">'+ce+'</span>';else h+='<span class="bad">'+ce+'</span>';}
      else if(i===inputText.length)h+='<span class="cur">'+ce+'</span>';
      else h+=ce;
    }
    td.innerHTML=h;
  }
  buildInitial();render('');
  function calcStats(el){
    var correct=0;var lim=Math.min(inputText.length,sample.length);
    for(var i=0;i<lim;i++){if(inputText[i]===sample[i])correct++;}
    var wpm=(correct/5)/(el/60);
    var acc=inputText.length>0?correct/inputText.length:0;
    return {correct:correct,wpm:wpm,acc:acc};
  }
  function fr(){
    if(done)return;done=true;if(timer)clearInterval(timer);input.disabled=true;
    var el=(performance.now()-startTime)/1000;var st=calcStats(el);
    var s=0;
    if(inputText.length>0){var ss=Math.max(0,Math.min(100,(st.wpm/p.baseWPM)*50));var as=st.acc*100*0.5;s=Math.round(ss+as);s=Math.max(0,Math.min(100,s));}
    info.textContent=t('tDone')+' · WPM '+st.wpm.toFixed(1)+' · '+Math.round(st.acc*100)+'%';
    sfxDone();
    setTimeout(function(){finish(s,{wpm:Math.round(st.wpm),accuracy:Math.round(st.acc*100),typed:inputText.length});},1200);
  }
  btn.addEventListener('click',function(){
    btn.style.display='none';input.style.display='block';input.focus();startTime=performance.now();render('');
    var r=p.durationSec;
    timer=setInterval(function(){
      r--;var el=(performance.now()-startTime)/1000;var st=calcStats(el);
      info.textContent=t('tRemainSec')+' '+r+t('tSec')+' · '+st.wpm.toFixed(0)+' WPM · '+Math.round(st.acc*100)+'%';
      if(r<=0)fr();
    },250);
  });
  input.addEventListener('input',function(){
    inputText=input.value;
    if(inputText.length>sample.length-60)sample+=pickSample()+' ';
    render();
    if(inputText.length>=sample.length-10)sample+=pickSample()+' ';
  });
  currentCleanup=function(){if(timer)clearInterval(timer);};
}};

TESTS.chase={start:function(area,finish){
  var p=CONFIG.projects.chase;var wrap=document.createElement('div');wrap.style.width='100%';
  var info=document.createElement('div');info.style.cssText='font-size:13px;color:var(--text-3);text-align:center;padding:12px';info.textContent=t('tClickStart')+' · '+t('tFollowMouse')+' · '+p.durationSec+t('tSec');
  var arena=document.createElement('div');arena.className='chase-area';
  var target=document.createElement('div');target.className='chase-target';target.style.width=p.targetSize+'px';target.style.height=p.targetSize+'px';target.style.display='none';
  var cursor=document.createElement('div');cursor.className='chase-cursor';cursor.style.display='none';
  arena.appendChild(target);arena.appendChild(cursor);wrap.appendChild(info);wrap.appendChild(arena);area.appendChild(wrap);
  var state={phase:'intro',mouseX:0,mouseY:0,inT:0,tt:0,raf:null,timer:null,lastTs:0,startTs:0,
    freqX1:0,freqX2:0,freqY1:0,freqY2:0,phaseX1:0,phaseX2:0,phaseY1:0,phaseY2:0,ampX1:0,ampX2:0,ampY1:0,ampY2:0,speedScale:1};
  var _chaseInfoTimer=null;
  function initRandomPath(){
    var sp=p.speed;
    state.speedScale=Math.max(0.25,Math.min(2.0,sp/3.0));
    state.freqX1=0.15+Math.random()*0.15;state.freqX2=0.45+Math.random()*0.35;
    state.freqY1=0.15+Math.random()*0.15;state.freqY2=0.45+Math.random()*0.35;
    state.phaseX1=Math.random()*Math.PI*2;state.phaseX2=Math.random()*Math.PI*2;
    state.phaseY1=Math.random()*Math.PI*2;state.phaseY2=Math.random()*Math.PI*2;
    state.ampX1=0.55+Math.random()*0.25;state.ampX2=0.20+Math.random()*0.20;
    state.ampY1=0.55+Math.random()*0.25;state.ampY2=0.20+Math.random()*0.20;
  }
  function step(){
    if(state.phase!=='run')return;
    var sz=p.targetSize;var w=arena.clientWidth-sz;var h=arena.clientHeight-sz;
    var cx=w/2,cy=h/2;
    var now=performance.now();
    var tt=(now-state.startTs)/1000*state.speedScale;
    var nx=Math.sin(tt*state.freqX1*Math.PI*2+state.phaseX1)*state.ampX1+Math.sin(tt*state.freqX2*Math.PI*2+state.phaseX2)*state.ampX2;
    var ny=Math.sin(tt*state.freqY1*Math.PI*2+state.phaseY1)*state.ampY1+Math.sin(tt*state.freqY2*Math.PI*2+state.phaseY2)*state.ampY2;
    if(nx>1)nx=1;if(nx<-1)nx=-1;if(ny>1)ny=1;if(ny<-1)ny=-1;
    var x=cx+nx*(w/2);var y=cy+ny*(h/2);
    target.style.left=x+'px';target.style.top=y+'px';
    var tcx=x+sz/2,tcy=y+sz/2;
    var dx=state.mouseX-tcx,dy=state.mouseY-tcy;
    var inTarget=Math.sqrt(dx*dx+dy*dy)<sz/2;
    var dt=now-state.lastTs;state.tt+=dt;if(inTarget)state.inT+=dt;
    state.lastTs=now;state.raf=requestAnimationFrame(step);
  }
  arena.addEventListener('pointermove',function(e){var r=arena.getBoundingClientRect();state.mouseX=e.clientX-r.left;state.mouseY=e.clientY-r.top;cursor.style.left=state.mouseX+'px';cursor.style.top=state.mouseY+'px';});
  arena.addEventListener('pointerdown',function(e){
    if(state.phase!=='intro')return;if(e.pointerType==='mouse'&&e.button!==0)return;
    state.phase='run';target.style.display='block';cursor.style.display='block';
    var r=arena.getBoundingClientRect();state.mouseX=e.clientX-r.left;state.mouseY=e.clientY-r.top;
    initRandomPath();state.startTs=performance.now();state.lastTs=state.startTs;state.inT=0;state.tt=0;
    info.textContent=t('tTrack')+' 0.0%';
    _chaseInfoTimer=setInterval(function(){
      if(state.phase!=='run'){clearInterval(_chaseInfoTimer);return;}
      var _pct=state.tt>0?state.inT/state.tt*100:0;
      info.textContent=t('tTrack')+' '+_pct.toFixed(1)+'%';
    },200);
    state.raf=requestAnimationFrame(step);
    state.timer=setTimeout(function(){
      state.phase='done';cancelAnimationFrame(state.raf);
      if(_chaseInfoTimer)clearInterval(_chaseInfoTimer);
      var pct=state.tt>0?state.inT/state.tt*100:0;var s=Math.round(pct);
      info.textContent=t('tHitRate')+' '+pct.toFixed(1)+'%';
      sfxDone();
      setTimeout(function(){finish(s,{hitPercent:Math.round(pct)});},1000);
    },p.durationSec*1000);
  });
  currentCleanup=function(){if(state.raf)cancelAnimationFrame(state.raf);if(state.timer)clearTimeout(state.timer);if(_chaseInfoTimer)clearInterval(_chaseInfoTimer);};
}};

/* ---------- 8. 听觉反应 ---------- */
TESTS.sound={start:function(area,finish){
  var p=CONFIG.projects.sound;
  var state={mode:'idle',times:[],timer:null,startT:null};
  var panel=makeTestPanel('',t('tClickStart'),p.trials+' '+t('tTimesCount'));
  area.appendChild(panel);
  function next(){
    state.mode='waiting';
    panel.className='test-panel r';
    panel.querySelector('.mt').textContent=t('tListen');
    panel.querySelector('.st').textContent=t('tHearBeep');
    state.timer=setTimeout(function(){
      state.mode='ready';
      playBeep(880,0.12,'square',0.15);
      state.startT=performance.now();
    },p.delayMin+Math.random()*(p.delayMax-p.delayMin));
  }
  function handler(e){
    if(e.pointerType==='mouse'&&e.button!==0)return;
    ensureAudio();
    if(state.mode==='idle'){next();return;}
    if(state.mode==='waiting'){clearTimeout(state.timer);state.mode='idle';panel.className='test-panel e';panel.querySelector('.mt').textContent=t('tTooEarly');panel.querySelector('.st').textContent=t('tClickRetry');playBeep(300,0.12,'square',0.08);return;}
    if(state.mode==='ready'){
      var tt=Math.round(performance.now()-state.startT);
      state.times.push(tt);
      if(state.times.length>=p.trials){
        var avg=state.times.reduce(function(a,b){return a+b;},0)/state.times.length;
        var score=Math.max(0,Math.min(100,100-(avg-p.speedBase)*p.speedFactor));
        state.mode='done';panel.className='test-panel s';
        panel.querySelector('.mt').textContent=t('tDone');
        var _min=Math.min.apply(null,state.times);
        panel.querySelector('.st').textContent=t('tAvg')+' '+Math.round(avg)+'ms · '+t('tBest')+' '+_min+'ms';
        sfxDone();
        setTimeout(function(){finish(Math.round(score),{times:state.times,avg:Math.round(avg),best:_min});},1100);
        return;
      }
      state.mode='idle';panel.className='test-panel s';

  wrap.appendChild(info);wrap.appendChild(pad);wrap.appendChild(btn);area.appendChild(wrap);

    pad.innerHTML='';

      (function(idx){
        var b=document.createElement('button');b.className='rhythm-btn';b.textContent=(idx+1);
        b.addEventListener('click',function(){
          if(state.phase!=='play')return;
          var now=performance.now();

          state.lastClick=now;
          b.classList.add('on');setTimeout(function(){b.classList.remove('on');},100);
          playBeep(600,0.05,'sine',0.15);
          if(state.userGaps.length>=p.beats){finishRound();}
        });
        pad.appendChild(b);
      })(i);
    }
  }
  function playSequence(){
    state.playing=true;state.phase='listen';
    info.textContent=t('tRhythmListen');
    state.gaps=[];
    for(var i=1;i<p.beats;i++)state.gaps.push(p.gapMinMs+Math.random()*(p.gapMaxMs-p.gapMinMs));
    playTone(700,0.10,0);
    for(var j=0;j<state.gaps.length;j++){
      playTone(700,0.10,(state.gaps.slice(0,j+1).reduce(function(a,b){return a+b;},0))/1000);
    }
    var totalDelay=state.gaps.reduce(function(a,b){return a+b;},0)+800;
    setTimeout(function(){

    var score=Math.max(0,Math.min(100,Math.round(100-avgErr/5)));
    info.textContent=t('tDone')+' · '+t('tTimeResult')+' '+Math.round(avgErr)+'ms';
    sfxDone();

  }

    btn.style.display='none';buildPad();playSequence();
  });
  currentCleanup=function(){};

  var LETTERS='BCDFGHJKLMNPQRSTVWXZ';
  var state={trial:0,correct:0,history:[],current:'',isSame:false,locked:false,phase:'intro',rafId:null,trialTimer:null,trialStartTs:0};

  var found=document.createElement('div');found.style.cssText='font-size:13px;color:var(--accent);font-weight:700';found.textContent=t('tSpotFound')+' 0/'+p.diffCount;
  var btn=document.createElement('button');btn.className='btn btn-primary';btn.style.cssText='flex:none;padding:12px 30px;margin-top:10px';btn.textContent=t('tClickStart');
  wrap.appendChild(info);wrap.appendChild(panels);wrap.appendChild(found);wrap.appendChild(btn);area.appendChild(wrap);
  var N=p.gridSize;
  var cellSize=Math.min(44,Math.floor((window.innerWidth-100)/(N*2+2)));
  if(cellSize<24)cellSize=24;
  var state={phase:'intro',diffs:[],foundSet:{},count:0};
  function render(){
    var gridTpl='repeat('+N+','+cellSize+'px)';
    leftGrid.style.gridTemplateColumns=gridTpl;
    rightGrid.style.gridTemplateColumns=gridTpl;
    leftGrid.innerHTML='';rightGrid.innerHTML='';
    var colors=[];
    for(var i=0;i<N*N;i++){
      var h=Math.floor(Math.random()*360);
      var l=55+Math.random()*15;
      colors.push('hsl('+h+',60%,'+l+'%)');
    }
    state.diffs=[];
    var pool=[];for(var k=0;k<N*N;k++)pool.push(k);
    for(var d=pool.length-1;d>0;d--){var j=Math.floor(Math.random()*(d+1));var tmp=pool[d];pool[d]=pool[j];pool[j]=tmp;}
    for(var m=0;m<p.diffCount;m++)state.diffs.push(pool[m]);
    for(var idx=0;idx<N*N;idx++){
      var cl=document.createElement('div');cl.className='sd-cell';
      cl.style.width=cellSize+'px';cl.style.height=cellSize+'px';
      cl.style.background=colors[idx];
      cl.dataset.i=idx;
      leftGrid.appendChild(cl);
      var cr=document.createElement('div');cr.className='sd-cell';
      cr.style.width=cellSize+'px';cr.style.height=cellSize+'px';
      if(state.diffs.indexOf(idx)>=0){
        var h2=(parseInt(colors[idx].split('hsl(')[1])+60)%360;
        cr.style.background='hsl('+h2+',60%,70%)';
      }else{
        cr.style.background=colors[idx];
      }
      cr.dataset.i=idx;
      cr.addEventListener('click',function(){
        if(state.phase!=='run')return;
        var ii=parseInt(this.dataset.i,10);
        if(state.foundSet[ii])return;
        if(state.diffs.indexOf(ii)>=0){
          state.foundSet[ii]=1;state.count++;
          this.classList.add('found');
          found.textContent=t('tSpotFound')+' '+state.count+'/'+p.diffCount;
          playBeep(1200,0.05,'square',0.06);
          var lc=leftGrid.children[ii];if(lc)lc.classList.add('found');
          if(state.count>=p.diffCount){
            state.phase='done';
            info.textContent=t('tDone');
            sfxDone();
            setTimeout(function(){finish(100,{found:state.count,total:p.diffCount});},1200);
          }
        }else{
          this.style.outline='3px solid #ff5252';
          var self=this;setTimeout(function(){self.style.outline='';},200);
          playBeep(250,0.10,'square',0.08);
        }
      });
      rightGrid.appendChild(cr);
    }
  }
  btn.addEventListener('click',function(){
    btn.style.display='none';state.phase='run';state.foundSet={};state.count=0;
    found.textContent=t('tSpotFound')+' 0/'+p.diffCount;
    render();
  });
  currentCleanup=function(){};
}};

function buildRadarSvg(latest){
  var keys=['reaction','aim','sequence','number','color','typing','chase','sound','schulte','stroop','rhythm','timePerception','goNoGo','nback','math','spotDiff'];
var labels={reaction:t('radarReaction'),aim:t('radarAim'),sequence:t('radarSequence'),number:t('radarNumber'),color:t('radarColor'),typing:t('radarTyping'),chase:t('radarChase'),sound:t('radarSound'),schulte:t('radarSchulte'),stroop:t('radarStroop'),rhythm:t('radarRhythm'),timePerception:t('radarTime'),goNoGo:t('radarGoNoGo'),nback:t('radarNback'),math:t('radarMath'),spotDiff:t('radarSpotDiff')};
  var N=keys.length;
  var cx=180,cy=170,r=130;
  var vals=keys.map(function(k){var v=getProjectScore(latest,k);return v===null?0:v;});
  var angleStep=(Math.PI*2)/N;
  var h='<svg class="radar-svg" viewBox="0 0 360 360">';
  for(var ring=1;ring<=4;ring++){
    var rr=r*ring/4;var pts=[];
    for(var i=0;i<N;i++){var ang=-Math.PI/2+i*angleStep;pts.push((cx+Math.cos(ang)*rr).toFixed(1)+','+(cy+Math.sin(ang)*rr).toFixed(1));}
    h+='<polygon class="radar-ring" points="'+pts.join(' ')+'"/>';
  }
  for(var i2=0;i2<N;i2++){
    var a=-Math.PI/2+i2*angleStep;
    h+='<line class="radar-axis-line" x1="'+cx+'" y1="'+cy+'" x2="'+(cx+Math.cos(a)*r).toFixed(1)+'" y2="'+(cy+Math.sin(a)*r).toFixed(1)+'"/>';
    var lx=cx+Math.cos(a)*(r+22);var ly=cy+Math.sin(a)*(r+22);
    h+='<text class="radar-axis-label" x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="middle" dominant-baseline="middle">'+labels[keys[i2]]+'</text>';
  }
  var polyPts=[];
  for(var j=0;j<N;j++){var vv=Math.max(0,Math.min(100,vals[j]));var ang2=-Math.PI/2+j*angleStep;var rr2=r*vv/100;polyPts.push((cx+Math.cos(ang2)*rr2).toFixed(1)+','+(cy+Math.sin(ang2)*rr2).toFixed(1));}
  h+='<polygon class="radar-poly" points="'+polyPts.join(' ')+'"/>';
  for(var k2=0;k2<N;k2++){var vv2=Math.max(0,Math.min(100,vals[k2]));var ang3=-Math.PI/2+k2*angleStep;var rr3=r*vv2/100;h+='<circle class="radar-dot" cx="'+(cx+Math.cos(ang3)*rr3).toFixed(1)+'" cy="'+(cy+Math.sin(ang3)*rr3).toFixed(1)+'" r="2.5"/>';}
  h+='</svg>';
  return h;
}
function buildGrowthSvg(scores){
  if(!scores||scores.length===0)return '';
  var sorted=scores.slice().sort(function(a,b){return a.ts-b.ts;});
  var data=sorted.slice(-20);
  var W=760,H=200,padL=36,padR=12,padT=16,padB=26;
  var innerW=W-padL-padR,innerH=H-padT-padB;
  var scores2=data.map(function(x){return x.score||0;});
  var minS=Math.min.apply(null,scores2);
  var maxS=Math.max.apply(null,scores2);
  if(maxS-minS<10){minS=Math.max(0,minS-5);maxS=Math.min(100,maxS+5);}
  var h='<svg class="growth-svg" viewBox="0 0 '+W+' '+H+'">';
  for(var g=0;g<=4;g++){
    var yy=padT+innerH*g/4;var val=Math.round(maxS-(maxS-minS)*g/4);
    h+='<line class="growth-grid" x1="'+padL+'" y1="'+yy.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+yy.toFixed(1)+'"/>';
    h+='<text class="growth-axis-label" x="'+(padL-6)+'" y="'+yy.toFixed(1)+'" text-anchor="end" dominant-baseline="middle">'+val+'</text>';
  }
  var pts=[],linePts=[];
  for(var i=0;i<data.length;i++){
    var x=padL+(data.length===1?innerW/2:innerW*i/(data.length-1));
    var y=padT+innerH-(scores2[i]-minS)/(maxS-minS||1)*innerH;
    pts.push({x:x,y:y,s:scores2[i]});
    linePts.push(x.toFixed(1)+','+y.toFixed(1));
  }
  var areaPath='M'+pts[0].x.toFixed(1)+','+(padT+innerH).toFixed(1)+' L'+linePts.join(' L')+' L'+pts[pts.length-1].x.toFixed(1)+','+(padT+innerH).toFixed(1)+' Z';
  h+='<path class="growth-area" d="'+areaPath+'"/>';
  h+='<polyline class="growth-line" points="'+linePts.join(' ')+'"/>';
  for(var j=0;j<pts.length;j++){h+='<circle class="growth-dot" cx="'+pts[j].x.toFixed(1)+'" cy="'+pts[j].y.toFixed(1)+'" r="3"/>';}
  h+='</svg>';
  return h;
}

  modalBox.innerHTML='<div class="modal-title"><span>'+t('pfShare')+'</span><button class="profile-close" onclick="closeModal()">'+t('pfClose')+'</button></div>'+
    '<div class="modal-hint" style="margin-bottom:12px">右键图片保存，或长按保存</div>'+
    '<img class="share-card-canvas" src="'+dataUrl+'" style="width:100%;max-width:720px;display:block">'+
    '<div class="modal-actions"><button class="btn btn-primary" id="btnShareDownload" type="button">'+t('pfSave')+' PNG</button></div>';
  document.getElementById('btnShareDownload').addEventListener('click',function(){var a=document.createElement('a');a.href=dataUrl;a.download='juntea_'+(userInfo.name||'user')+'_'+best.score+'.png';document.body.appendChild(a);a.click();document.body.removeChild(a);});
}
/* ============================================================
   更新日志
   ============================================================ */
var changelogCache=null;
async function openChangelog(){
  modalOverlay.style.display='flex';
  modalBox.innerHTML='<div class="modal-title"><span>'+t('changelogTitle')+'</span><button class="profile-close" id="btnChangelogClose" type="button">'+t('pfClose')+'</button></div>'+
    '<div class="lb-empty">'+t('changelogLoading')+'</div>';
  document.getElementById('btnChangelogClose').addEventListener('click',closeModal);
  var list=changelogCache;
  if(!list){
    try{
      var res=await supabase.from('changelog').select('*').order('sort_order',{ascending:false}).order('id',{ascending:false}).limit(50);
      if(res.error){
        modalBox.innerHTML='<div class="modal-title"><span>'+t('changelogTitle')+'</span><button class="profile-close" id="btnChangelogClose2" type="button">'+t('pfClose')+'</button></div><div class="lb-empty">'+t('loadFailed')+escapeHtml(res.error.message)+'</div>';
        document.getElementById('btnChangelogClose2').addEventListener('click',closeModal);
        return;
      }
      list=res.data||[];
      changelogCache=list;
    }catch(e){
      modalBox.innerHTML='<div class="modal-title"><span>'+t('changelogTitle')+'</span><button class="profile-close" id="btnChangelogClose3" type="button">'+t('pfClose')+'</button></div><div class="lb-empty">'+t('netError')+escapeHtml(String(e.message||e))+'</div>';
      document.getElementById('btnChangelogClose3').addEventListener('click',closeModal);
      return;
    }
  }
  var body=modalBox.querySelector('.lb-empty');
  if(!body)return;
  if(!list.length){
    body.innerHTML=t('changelogEmpty');
    return;
  }
  var h='';
  for(var i=0;i<list.length;i++){
    var it=list[i];
    var content=String(it.content||'').replace(/\n/g,'<br>');
    h+='<div style="border-bottom:1px solid var(--border);padding:14px 0;'+(i===list.length-1?'border-bottom:none':'')+'">';
    h+='<div style="display:flex;align-items:baseline;gap:10px;margin-bottom:6px;flex-wrap:wrap">';
    h+='<span style="font-weight:800;color:var(--accent);font-size:14px">'+escapeHtml(it.version||'')+'</span>';
    if(it.date_text) h+='<span style="font-size:10px;color:var(--text-5)">'+escapeHtml(it.date_text)+'</span>';
    if(it.title) h+='<span style="font-size:12px;color:var(--text);font-weight:600">'+escapeHtml(it.title)+'</span>';
    h+='</div>';
    h+='<div style="font-size:12px;color:var(--text-3);line-height:1.8">'+content+'</div>';
    h+='</div>';
  }
  body.outerHTML=h;
}
document.getElementById('btnChangelog').addEventListener('click',openChangelog);
