<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Jun.Tea · 综合反应测试</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"JetBrains Mono","SF Mono",Consolas,"Courier New",monospace;background:#0a0a0a;color:#e8e8e8;min-height:100vh;padding:24px 16px;user-select:none;-webkit-user-select:none;letter-spacing:.02em;display:flex;justify-content:center;align-items:flex-start;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.container{width:100%;max-width:960px}
.brand-bar{display:flex;justify-content:space-between;align-items:center;padding:0 4px 14px;border-bottom:1px solid #1e1e1e;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.brand{font-size:14px;font-weight:700;letter-spacing:.15em}
.brand .dot{color:#00ffff}
.brand-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand-meta{font-size:11px;color:#555;letter-spacing:.1em}
.user-chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid #1e1e1e;background:#0d0d0d;font-size:11px;letter-spacing:.1em;color:#aaa}
.user-chip.admin{border-color:#a855f7;background:rgba(168,85,247,.08);color:#c084fc;box-shadow:0 0 12px rgba(168,85,247,.3)}
.user-chip .star{color:#a855f7;font-size:12px}
.user-chip .uid{color:#666;font-size:10px}
.user-chip.admin .uid{color:#a855f7}
.logout-btn{padding:4px 10px;border:1px solid #262626;background:#111;color:#888;font-family:inherit;font-size:11px;letter-spacing:.1em;cursor:pointer}
.logout-btn:hover{color:#ff5252;border-color:#3a1010}
.mobile-tip{display:none;padding:14px 16px;background:rgba(255,159,67,.08);border:1px solid #3a2a10;color:#ff9f43;font-size:12px;letter-spacing:.05em;margin-bottom:16px;line-height:1.7;border-radius:0}
.mobile-tip b{color:#ffbe76}
.login-wrap{display:flex;justify-content:center;align-items:center;min-height:70vh;width:100%}
.login-box{width:100%;max-width:460px;background:#111;border:1px solid #1e1e1e;padding:0}
.login-brand{text-align:center;font-size:20px;font-weight:700;letter-spacing:.25em;padding:32px 32px 6px 32px}
.login-brand .dot{color:#00ffff}
.login-sub{text-align:center;font-size:11px;color:#555;letter-spacing:.2em;margin-bottom:24px}
.login-tabs{display:flex;background:#0d0d0d;border-bottom:1px solid #1e1e1e}
.login-tab{flex:1;padding:14px;background:transparent;border:none;color:#666;font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.2em;cursor:pointer;position:relative;transition:color .15s}
.login-tab:hover{color:#aaa}
.login-tab.active{color:#00ffff}
.login-tab.active::after{content:'';position:absolute;bottom:-1px;left:20%;right:20%;height:2px;background:#00ffff}
.login-tab[data-tab="admin"].active{color:#a855f7}
.login-tab[data-tab="admin"].active::after{background:#a855f7}
.login-panel{padding:28px 32px 36px 32px}
.login-panel.admin-mode{background:linear-gradient(180deg,rgba(168,85,247,.04) 0%,transparent 100%);border-top:2px solid #a855f7}
.admin-badge{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;background:rgba(168,85,247,.08);border:1px solid #a855f7;margin-bottom:20px;font-size:11px;font-weight:700;letter-spacing:.25em;color:#c084fc}
.admin-badge .lock{font-size:14px}
.login-field{margin-bottom:16px}
.login-field label{display:block;font-size:11px;color:#666;letter-spacing:.15em;margin-bottom:8px}
.login-field input{width:100%;padding:13px 14px;background:#0a0a0a;border:1px solid #262626;color:#e8e8e8;font-family:inherit;font-size:14px;outline:none;text-transform:uppercase;-webkit-appearance:none;border-radius:0}
.login-field input.pwd{text-transform:none}
.login-field input:focus{border-color:#00ffff}
.login-panel.admin-mode .login-field input:focus{border-color:#a855f7}
.login-error{font-size:12px;color:#ff5252;min-height:18px;margin-bottom:10px;line-height:1.5}
.login-btns{display:flex;gap:8px;margin-top:8px}
.login-btn{flex:1;padding:14px;background:#00ffff;color:#001a1f;border:1px solid #00ffff;font-family:inherit;font-size:14px;font-weight:700;letter-spacing:.2em;cursor:pointer}
.login-btn:hover{background:#00cccc}
.login-btn.ghost{background:transparent;color:#00ffff;border:1px solid #00ffff}
.login-btn.ghost:hover{background:rgba(0,255,255,.08)}
.login-btn:disabled{opacity:.5;cursor:not-allowed}
.login-btn.admin{background:#a855f7;color:#fff;border-color:#a855f7}
.login-btn.admin:hover{background:#9333ea}
.login-hint{font-size:10px;color:#555;text-align:center;margin-top:20px;line-height:1.9}
.login-hint b{color:#888}
.view-title{font-size:14px;font-weight:700;letter-spacing:.2em;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.view-title .sub{font-size:11px;color:#666;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:#111;border:1px solid #1e1e1e;padding:18px;cursor:pointer}
.card:hover{border-color:#00ffff}
.card.done{border-color:#00a0a0;background:#0d1618}
.card.expired{border-color:#3a1010}
.card-name{font-size:14px;font-weight:700;letter-spacing:.1em;margin-bottom:6px}
.card-desc{font-size:11px;color:#666;line-height:1.5;margin-bottom:12px;min-height:32px}
.card-score{font-size:32px;font-weight:800;line-height:1}
.card-score .u{font-size:12px;color:#555;margin-left:4px}
.card-foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px;font-size:10px;color:#555}
.card-tag{font-size:9px;padding:2px 6px;border:1px solid #262626;color:#666}
.card-tag.done{color:#00ffff;border-color:#0a3a3a}
.card-tag.expired{color:#ff5252;border-color:#3a1010}
.summary{margin-top:16px;background:#111;border:1px solid #1e1e1e;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.summary-total{font-size:40px;font-weight:800;line-height:1}
.summary-total .u{font-size:14px;color:#555;margin-left:6px}
.summary-info{font-size:11px;color:#666;line-height:1.8}
.summary-info b{color:#e8e8e8}
.summary-locked{font-size:11px;color:#ff9f43;padding:8px 12px;border:1px solid #3a2a10;background:#1a1408}
.test-area{background:#111;border:1px solid #1e1e1e;min-height:420px;display:flex;flex-direction:column}
.test-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid #1e1e1e}
.test-header-name{font-size:13px;font-weight:700;letter-spacing:.2em;color:#00ffff}
.test-header-info{font-size:11px;color:#666}
.test-body{flex:1;position:relative;min-height:380px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.test-panel{width:100%;height:380px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;position:relative;background:#111}
.test-panel.w{background:#8a1f1f}
.test-panel.r{background:#00d000}
.test-panel.e{background:#5a1010}
.test-panel.s{background:#0d2430}
.test-panel.i{background:#3a0a0a}
.test-panel .mt{font-size:26px;font-weight:700;color:#fff;text-align:center;padding:0 20px;line-height:1.4}
.test-panel .st{font-size:13px;color:rgba(255,255,255,.7);text-align:center;margin-top:10px;padding:0 20px}
.aim-target{position:absolute;border-radius:50%;background:#00ffff;cursor:crosshair;border:2px solid #00a0a0;display:flex;align-items:center;justify-content:center;color:#001a1f;font-weight:800}
.aim-target:active{background:#00cccc}
.seq-grid{display:grid;gap:4px;background:#1e1e1e;border:1px solid #1e1e1e;padding:4px}
.seq-cell{background:#1a1a1a;cursor:pointer}
.seq-cell:hover{background:#222}
.seq-cell.on{background:#00ffff}
.seq-cell.ok{background:#00b8b8}
.num-display{font-size:72px;font-weight:800;color:#e8e8e8;letter-spacing:.1em;text-align:center}
.num-input{padding:16px;font-size:24px;background:#0a0a0a;border:1px solid #262626;color:#e8e8e8;font-family:inherit;letter-spacing:.2em;text-align:center;outline:none;width:100%;max-width:500px;-webkit-appearance:none;border-radius:0}
.num-input:focus{border-color:#00ffff}
.color-grid{display:grid;gap:8px;padding:8px}
.color-cell{cursor:pointer;border-radius:4px}
.typing-text{font-size:20px;line-height:1.8;padding:24px 32px;color:#888;text-align:left;max-width:760px}
.typing-text .ok{color:#00ffff}
.typing-text .bad{color:#ff5252;background:#3a0a0a}
.typing-text .cur{border-bottom:2px solid #fff}
.typing-input{width:100%;max-width:760px;padding:14px;font-size:18px;background:#0a0a0a;border:1px solid #262626;color:#e8e8e8;font-family:inherit;outline:none;margin-top:20px;-webkit-appearance:none;border-radius:0}
.typing-input:focus{border-color:#00ffff}
.chase-area{position:relative;width:100%;height:380px;background:#0a0a0a;cursor:crosshair;overflow:hidden}
.chase-target{position:absolute;border-radius:50%;background:radial-gradient(circle,#00ffff,#00a0a0);border:2px solid #fff;pointer-events:none}
.chase-cursor{position:absolute;width:14px;height:14px;border-radius:50%;background:#ff5252;pointer-events:none;transform:translate(-50%,-50%);border:2px solid #fff}
.test-foot{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-top:1px solid #1e1e1e;font-size:11px;color:#666}
.leaderboard-section{margin-top:16px;border:1px solid #1e1e1e;background:#111}
.leaderboard-header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#0d0d0d;border-bottom:1px solid #1e1e1e;cursor:pointer}
.leaderboard-header:hover{background:#131313}
.leaderboard-header-title{font-size:12px;font-weight:700;letter-spacing:.2em;display:flex;align-items:center;gap:10px}
.leaderboard-header-count{font-size:11px;color:#00ffff}
.leaderboard-toggle{font-size:11px;color:#555}
.leaderboard-body{display:block}
.leaderboard-body.collapsed{display:none}
.lb-group{border-bottom:1px solid #141414}
.lb-group:last-child{border-bottom:none}
.lb-row{display:grid;grid-template-columns:52px 1fr 70px 56px 190px;padding:14px 16px;font-size:13px;align-items:center;cursor:pointer}
.lb-row:hover{background:#131313}
.lb-group.rank-1 .lb-row{background:linear-gradient(90deg,rgba(255,215,0,.14) 0%,rgba(255,215,0,.02) 55%,transparent 100%);border-left:3px solid #ffd700}
.lb-group.rank-2 .lb-row{background:linear-gradient(90deg,rgba(192,192,192,.12) 0%,rgba(192,192,192,.02) 55%,transparent 100%);border-left:3px solid #c0c0c0}
.lb-group.rank-3 .lb-row{background:linear-gradient(90deg,rgba(205,127,50,.12) 0%,rgba(205,127,50,.02) 55%,transparent 100%);border-left:3px solid #cd7f32}
.lb-group.is-admin .lb-row{background:linear-gradient(90deg,rgba(168,85,247,.20) 0%,rgba(168,85,247,.04) 55%,transparent 100%);border-left:3px solid #a855f7;border-right:2px solid #a855f7}
.lb-group.is-admin .lb-row:hover{background:linear-gradient(90deg,rgba(168,85,247,.26) 0%,rgba(168,85,247,.06) 55%,transparent 100%)}
.lb-group.is-me .lb-row{box-shadow:inset 0 0 0 1px rgba(0,255,255,.3)}
.lb-rank{font-weight:800;font-size:14px}
.lb-group.rank-1 .lb-rank{color:#ffd700}
.lb-group.rank-2 .lb-rank{color:#c0c0c0}
.lb-group.rank-3 .lb-rank{color:#cd7f32}
.lb-group.is-admin .lb-rank{color:#c084fc}
.lb-group:not(.rank-1):not(.rank-2):not(.rank-3):not(.is-admin) .lb-rank{color:#555;font-size:12px;font-weight:700}
.lb-name{color:#e8e8e8;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:8px;display:flex;align-items:center;gap:6px}
.lb-group.is-admin .lb-name{color:#e9d5ff}
.lb-name .star{color:#a855f7;font-size:13px}
.lb-name .uid{font-size:10px;color:#555;font-weight:400}
.lb-group.is-admin .lb-name .uid{color:#a855f7}
.lb-name .cnt{font-size:10px;padding:1px 6px;background:#1a1a1a;border:1px solid #262626;color:#888;letter-spacing:.05em}
.lb-name .toggle-arrow{font-size:10px;color:#555}
.lb-score{color:#00ffff;font-weight:800;text-align:right;font-size:15px}
.lb-group.is-admin .lb-score{color:#c084fc}
.lb-grade{text-align:center;font-weight:800;font-size:14px}
.lb-ts{color:#4a7a7a;text-align:right;font-size:11px}
.lb-history{background:#0d0d0d;border-top:1px solid #1a1a1a}
.lb-history.collapsed{display:none}
.lb-history-inner{padding:8px 16px 12px 68px;display:flex;flex-wrap:wrap;gap:8px}
.lb-history-item{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;background:#111;border:1px solid #1e1e1e;font-size:11px}
.lb-history-item .sc{color:#00ffff;font-weight:700}
.lb-history-item .rk{font-weight:700}
.lb-history-item .tm{color:#555;font-size:10px}
.lb-history-item.is-best{border-color:#00a0a0;background:#0d1618}
.lb-group.is-admin .lb-history-item{border-color:#3a1f5c}
.lb-group.is-admin .lb-history-item.is-best{border-color:#a855f7;background:rgba(168,85,247,.06)}
.lb-empty{padding:24px;text-align:center;font-size:12px;color:#444;letter-spacing:.15em}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;justify-content:center;align-items:center;z-index:9999;padding:20px}
.modal{background:#111;border:1px solid #262626;padding:24px;max-width:900px;width:100%;max-height:90vh;overflow-y:auto}
.modal-title{font-size:13px;font-weight:700;letter-spacing:.25em;color:#00ffff;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid #1e1e1e;display:flex;justify-content:space-between;align-items:center}
.modal-sub{font-size:10px;color:#444}
.admin-tabs{display:flex;gap:1px;background:#1e1e1e;border:1px solid #1e1e1e;margin-bottom:20px;flex-wrap:wrap}
.tab-btn{flex:1;min-width:100px;padding:12px;background:#0d0d0d;border:none;color:#666;font-family:inherit;font-size:12px;font-weight:700;letter-spacing:.15em;cursor:pointer}
.tab-btn:hover{color:#aaa}
.tab-btn.active{background:#111;color:#00ffff}
.modal-section-title{font-size:11px;color:#666;letter-spacing:.15em;margin:18px 0 12px;padding-bottom:6px;border-bottom:1px dashed #1e1e1e}
.modal-section-title:first-child{margin-top:0}
.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.modal-field.full{grid-column:1/-1}
.modal-field label{display:block;font-size:11px;color:#666;margin-bottom:6px}
.modal-field input,.modal-field textarea{width:100%;padding:10px 12px;background:#0a0a0a;border:1px solid #262626;color:#e8e8e8;font-family:inherit;font-size:13px;outline:none}
.modal-field input:focus,.modal-field textarea:focus{border-color:#00ffff}
.modal-field textarea{resize:vertical;min-height:120px;line-height:1.6;font-size:12px}
.modal-hint{font-size:10px;color:#555;margin-top:6px;line-height:1.6}
.modal-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid #1e1e1e}
.modal-actions .btn{flex:1;min-width:100px}
.btn{padding:13px;border:1px solid #262626;background:#1a1a1a;color:#e8e8e8;font-family:inherit;font-size:13px;font-weight:700;letter-spacing:.15em;cursor:pointer;flex:1}
.btn:hover{background:#222}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn-primary{background:#00ffff;color:#001a1f;border-color:#00ffff}
.btn-primary:hover{background:#00cccc}
.btn-danger{background:#2a0e0e;color:#ff5252;border-color:#3a1010}
.btn-sm{padding:6px 10px;font-size:11px;flex:none}
.lb-toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.lb-toolbar .btn{flex:none}
.lb-admin-header{display:grid;grid-template-columns:36px 1fr 70px 80px 50px 190px 100px;gap:8px;padding:10px 12px;background:#0d0d0d;border:1px solid #1e1e1e;border-bottom:none;font-size:10px;color:#666;align-items:center}
.lb-admin-row{display:grid;grid-template-columns:36px 1fr 70px 80px 50px 190px 100px;gap:8px;padding:10px 12px;background:#0a0a0a;border:1px solid #1a1a1a;border-bottom:none;align-items:center;font-size:12px}
.lb-admin-row:last-child{border-bottom:1px solid #1a1a1a}
.lb-admin-row.is-admin{background:rgba(168,85,247,.06);border-left:3px solid #a855f7;padding-left:10px}
.lb-admin-row .cell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-admin-row .name{color:#e8e8e8;font-weight:600}
.lb-admin-row.is-admin .name{color:#e9d5ff}
.lb-admin-row .name .star{color:#a855f7;margin-right:4px}
.lb-admin-row .num{color:#00ffff;font-weight:700;text-align:right}
.lb-admin-row.is-admin .num{color:#c084fc}
.lb-admin-row .rank{text-align:center;font-weight:700}
.lb-admin-row .uid{color:#666;font-size:11px}
.lb-admin-row .ts{color:#4a7a7a;font-size:11px;text-align:right}
.lb-admin-row .actions{display:flex;gap:4px;justify-content:flex-end}
.lb-admin-row .actions .btn-sm{padding:4px 8px;font-size:10px}
.lb-empty{padding:30px 20px;text-align:center;color:#444;font-size:12px;border:1px solid #1a1a1a}
.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#1a1a1a;border:1px solid #a855f7;color:#c084fc;padding:18px 26px;font-size:13px;z-index:99999;pointer-events:none;max-width:90vw;text-align:center;line-height:1.6}
@media(max-width:700px){
body{padding:12px 8px}
.brand{font-size:12px}
.brand-meta{font-size:10px}
.user-chip{font-size:10px;padding:3px 8px}
.user-chip .uid{font-size:9px}
.logout-btn{font-size:10px;padding:3px 8px}
.login-box{max-width:100%}
.login-brand{font-size:17px;padding:24px 24px 6px 24px;letter-spacing:.2em}
.login-sub{font-size:10px;margin-bottom:18px}
.login-tab{font-size:11px;padding:12px;letter-spacing:.15em}
.login-panel{padding:22px 22px 28px 22px}
.login-field label{font-size:10px}
.login-field input{padding:12px;font-size:14px}
.login-btn{padding:13px;font-size:13px}
.login-hint{font-size:9px}
.view-title{font-size:12px;margin-bottom:12px}
.view-title .sub{font-size:10px}
.grid{grid-template-columns:1fr;gap:10px}
.card{padding:14px}
.card-name{font-size:13px}
.card-desc{font-size:10px;min-height:auto;margin-bottom:8px}
.card-score{font-size:26px}
.card-foot{font-size:9px}
.summary{padding:14px;flex-direction:column;align-items:flex-start;gap:12px}
.summary-total{font-size:34px}
.summary-info{font-size:10px}
.summary-locked{font-size:10px;padding:6px 10px}
.test-header{padding:10px 12px}
.test-header-name{font-size:12px}
.test-header-info{font-size:10px}
.test-body{min-height:320px}
.test-panel{height:320px}
.test-panel .mt{font-size:22px;padding:0 14px}
.test-panel .st{font-size:12px;padding:0 14px}
.seq-grid{gap:3px;padding:3px}
.num-display{font-size:52px}
.num-input{padding:14px;font-size:20px}
.color-grid{gap:6px;padding:6px}
.test-foot{padding:10px 12px;font-size:10px}
.test-foot .btn{padding:6px 12px !important;font-size:10px !important}
.leaderboard-header{padding:10px 12px}
.leaderboard-header-title{font-size:11px}
.leaderboard-header-count{font-size:10px}
.leaderboard-toggle{font-size:10px}
.lb-row{grid-template-columns:36px 1fr 48px 40px;padding:10px 12px;font-size:11px;gap:6px}
.lb-rank{font-size:12px}
.lb-name{font-size:11px;gap:4px}
.lb-name .uid{display:none}
.lb-name .cnt{font-size:9px;padding:1px 5px}
.lb-score{font-size:13px}
.lb-grade{font-size:12px}
.lb-ts{display:none}
.lb-history-inner{padding:6px 12px 10px 12px;gap:6px}
.lb-history-item{padding:4px 8px;font-size:10px}
.modal{padding:18px}
.modal-title{font-size:11px;letter-spacing:.2em;margin-bottom:12px;padding-bottom:10px}
.modal-grid{grid-template-columns:1fr}
.modal-field input,.modal-field textarea{font-size:13px;padding:10px}
.modal-actions{gap:6px}
.btn{padding:12px;font-size:12px}
.mobile-tip{display:block}
}
</style>
</head>
<body>
<div class="container">
  <div id="loginView" style="display:none">
    <div class="login-wrap">

async function doUserRegister(){
  var name=normalizeName(userLoginName.value);
  var key=userLoginKey.value.trim();
  userLoginError.textContent='';
  userLoginName.value=name;
  if(!name){userLoginError.textContent='请输入名字（仅英文字母）';userLoginName.focus();return;}
  if(name.length<2){userLoginError.textContent='名字至少 2 个字母';return;}
  if(!key){userLoginError.textContent='请设置你的密码';userLoginKey.focus();return;}
  if(key.length<4){userLoginError.textContent='密码至少 4 位';return;}
  if(name===DEFAULT_ADMIN_NAME){userLoginError.textContent='此名字已被管理员占用';return;}
  var cd=checkRegisterCooldown();
  if(!cd.ok){userLoginError.textContent=cd.msg;return;}
  var keyHash=userKeyHash(name,key);
  var checkRes=await supabase.from('users').select('*').eq('name',name).eq('key_hash',keyHash);
  if(checkRes.error){userLoginError.textContent='网络错误：'+checkRes.error.message;return;}
  if(checkRes.data&&checkRes.data.length>0){userLoginError.textContent='这个名字 + 密码已注册过，请直接点【登录】';return;}
  var newId=genUserId();
  var insRes=await supabase.from('users').insert([{id:newId,name:name,key_hash:keyHash,is_admin:false,created_ts:Date.now()}]);
  if(insRes.error){userLoginError.textContent='注册失败：'+insRes.error.message;return;}
  recordRegisterTime();
  alert('注册成功！\n\n你的名字：'+name+'\n你的 ID：'+newId+'\n\n以后请用名字 + 首次设置的密码登录。\n注意：密码忘记将无法找回账号。');
  currentUser={name:name,id:newId,isAdmin:false,loginTs:Date.now()};
  saveCurrentUser(currentUser);
  enterMain();
}

async function doUserLogin(){

function groupByUser(list){
  var map={};
  (list||[]).forEach(function(item){
    var key=item.user_id||item.id||item.name;
    if(!map[key])map[key]={userId:key,name:item.name,isAdmin:!!item.is_admin,records:[]};
    map[key].records.push(item);
  });
  var groups=Object.keys(map).map(function(k){var g=map[k];g.records.sort(function(a,b){return b.score-a.score;});g.best=g.records[0];return g;});
  groups.sort(function(a,b){return b.best.score-a.best.score;});
  return groups;
}
function refreshLeaderboardDisplay(hid){
  var list=cloudLeaderboardCache||[];
  var groups=groupByUser(list);
  leaderboardCount.textContent=groups.length+' 人';

function renderLeaderboardHtml(groups,hid){
  if(!groups||groups.length===0)return '<div class="lb-empty">暂无记录</div>';
  var showTs=!!CONFIG.showTimestamp;
  var top=groups.slice(0,CONFIG.topDisplay);
  return top.map(function(g,index){
    var c=gradeColor(g.best.rank);
    var cls='lb-group';
    if(index===0)cls+=' rank-1';else if(index===1)cls+=' rank-2';else if(index===2)cls+=' rank-3';
    if(g.isAdmin)cls+=' is-admin';
    var isMe=hid&&g.records.some(function(r){return r.id===hid;});
    if(isMe)cls+=' is-me';
    var star=g.isAdmin?'<span class="star">★</span>':'';
    var uid='<span class="uid">#'+escapeHtml(g.userId)+'</span>';
    var cnt=g.records.length;
    var cntHtml=cnt>1?'<span class="cnt">'+cnt+'次</span>':'';
    var arrow=cnt>1?'<span class="toggle-arrow">▾</span>':'';
    var expanded=!!expandedGroups[g.userId];
    var row='<div class="lb-row" data-uid="'+escapeHtml(g.userId)+'">'+
      '<div class="lb-rank">#'+(index+1)+'</div>'+
      '<div class="lb-name">'+star+escapeHtml(g.name)+uid+cntHtml+arrow+'</div>'+
      '<div class="lb-score">'+g.best.score+'</div>'+
      '<div class="lb-grade" style="color:'+c+'">'+escapeHtml(g.best.rank)+'</div>'+
      (showTs?'<div class="lb-ts">'+formatTs(g.best.ts)+'</div>':'<div class="lb-ts"></div>')+
    '</div>';
    var hist='';
    if(cnt>1){
      var items=g.records.map(function(r,i){
        var rc=gradeColor(r.rank);
        var isBest=(i===0);
        return '<div class="lb-history-item'+(isBest?' is-best':'')+'">'+
          '<span class="sc">'+r.score+'</span>'+
          '<span class="rk" style="color:'+rc+'">'+escapeHtml(r.rank)+'</span>'+
          '<span class="tm">'+formatTsShort(r.ts)+'</span>'+
        '</div>';
      }).join('');
      hist='<div class="lb-history'+(expanded?'':' collapsed')+'"><div class="lb-history-inner">'+items+'</div></div>';
    }
    return '<div class="'+cls+'">'+row+hist+'</div>';
  }).join('');
}

function getEnabledProjects(){

function computeTotal(){
  var s=purgeExpiredSession();var en=getEnabledProjects();var tw=0,ws=0;var items=[];
  en.forEach(function(k){var e=s[k],p=CONFIG.projects[k];if(e&&!isExpired(e)){ws+=e.score*p.weight;tw+=p.weight;items.push({key:k,score:e.score,weight:p.weight});}});
  var req=CONFIG.minTestsForTotal;
  if(IS_MOBILE&&req>en.length)req=en.length;
  var ready=items.length>=req;
  if(tw<=0||!ready)return{total:0,grade:'—',items:items,tested:items.length,totalCount:en.length,ready:false,required:req,need:Math.max(0,req-items.length)};

TESTS.chase={start:function(area,finish){
  var p=CONFIG.projects.chase;var wrap=document.createElement('div');wrap.style.width='100%';
  var info=document.createElement('div');info.style.cssText='font-size:13px;color:#888;text-align:center;padding:12px';info.textContent='点击开始 · 鼠标跟随目标 · '+p.durationSec+' 秒';
  var arena=document.createElement('div');arena.className='chase-area';
  var target=document.createElement('div');target.className='chase-target';target.style.width=p.targetSize+'px';target.style.height=p.targetSize+'px';target.style.display='none';
  var cursor=document.createElement('div');cursor.className='chase-cursor';cursor.style.display='none';
  arena.appendChild(target);arena.appendChild(cursor);wrap.appendChild(info);wrap.appendChild(arena);area.appendChild(wrap);
  var state={phase:'intro',mouseX:0,mouseY:0,inT:0,tt:0,raf:null,timer:null,lastTs:0,startTs:0,
    freqX1:0,freqX2:0,freqY1:0,freqY2:0,phaseX1:0,phaseX2:0,phaseY1:0,phaseY2:0,ampX1:0,ampX2:0,ampY1:0,ampY2:0,speedScale:1};

  function initRandomPath(){
    var sp=p.speed;
    state.speedScale=Math.max(0.6,Math.min(2.5,sp/1.5));
    state.freqX1=0.15+Math.random()*0.15;
    state.freqX2=0.45+Math.random()*0.35;
    state.freqY1=0.15+Math.random()*0.15;
    state.freqY2=0.45+Math.random()*0.35;
    state.phaseX1=Math.random()*Math.PI*2;
    state.phaseX2=Math.random()*Math.PI*2;
    state.phaseY1=Math.random()*Math.PI*2;
    state.phaseY2=Math.random()*Math.PI*2;
    state.ampX1=0.55+Math.random()*0.25;
    state.ampX2=0.20+Math.random()*0.20;
    state.ampY1=0.55+Math.random()*0.25;
    state.ampY2=0.20+Math.random()*0.20;
  }

  function step(){
    if(state.phase!=='run')return;
    var sz=p.targetSize;
    var w=arena.clientWidth-sz;
    var h=arena.clientHeight-sz;
    var cx=w/2,cy=h/2;
    var now=performance.now();
    var t=(now-state.startTs)/1000*state.speedScale;
    var nx=Math.sin(t*state.freqX1*Math.PI*2+state.phaseX1)*state.ampX1
          +Math.sin(t*state.freqX2*Math.PI*2+state.phaseX2)*state.ampX2;
    var ny=Math.sin(t*state.freqY1*Math.PI*2+state.phaseY1)*state.ampY1
          +Math.sin(t*state.freqY2*Math.PI*2+state.phaseY2)*state.ampY2;
    if(nx>1)nx=1;if(nx<-1)nx=-1;
    if(ny>1)ny=1;if(ny<-1)ny=-1;
    var x=cx+nx*(w/2);
    var y=cy+ny*(h/2);
    target.style.left=x+'px';target.style.top=y+'px';
    var tcx=x+sz/2,tcy=y+sz/2;
    var dx=state.mouseX-tcx,dy=state.mouseY-tcy;
    var inTarget=Math.sqrt(dx*dx+dy*dy)<sz/2;
    var dt=now-state.lastTs;
    state.tt+=dt;
    if(inTarget)state.inT+=dt;
    state.lastTs=now;
    state.raf=requestAnimationFrame(step);
  }
  arena.addEventListener('pointermove',function(e){var r=arena.getBoundingClientRect();state.mouseX=e.clientX-r.left;state.mouseY=e.clientY-r.top;cursor.style.left=state.mouseX+'px';cursor.style.top=state.mouseY+'px';});
  arena.addEventListener('pointerdown',function(e){
    if(state.phase!=='intro')return;if(e.pointerType==='mouse'&&e.button!==0)return;
    state.phase='run';target.style.display='block';cursor.style.display='block';
    var r=arena.getBoundingClientRect();state.mouseX=e.clientX-r.left;state.mouseY=e.clientY-r.top;
    initRandomPath();
    state.startTs=performance.now();
    state.lastTs=state.startTs;
    state.inT=0;state.tt=0;
    info.textContent='追踪中...';
    state.raf=requestAnimationFrame(step);
    state.timer=setTimeout(function(){
      state.phase='done';cancelAnimationFrame(state.raf);
      var pct=state.tt>0?state.inT/state.tt*100:0;var s=Math.round(pct);
      info.textContent='完成 · 命中率 '+pct.toFixed(1)+'%';
      setTimeout(function(){finish(s,{hitPercent:Math.round(pct)});},1000);
    },p.durationSec*1000);
  });
  currentCleanup=function(){if(state.raf)cancelAnimationFrame(state.raf);if(state.timer)clearTimeout(state.timer);};
}};

        var avg=state.times.reduce(function(a,b){return a+b;},0)/state.times.length;

        setTimeout(function(){finish(Math.round(score),{times:state.times,avg:Math.round(avg)});},900);return;
      }
      state.mode='idle';panel.className='test-panel s';panel.querySelector('.mt').textContent=t+'ms';panel.querySelector('.st').textContent='('+state.times.length+'/'+p.trials+')';
      setTimeout(next,700);
    }
  }
  panel.addEventListener('pointerdown',handler);

  var th='';
  th+='<button class="tab-btn'+(tab==='config'?' active':'')+'" data-tab="config" type="button">基础配置</button>';
  th+='<button class="tab-btn'+(tab==='leaderboard'?' active':'')+'" data-tab="leaderboard" type="button">排行榜管理</button>';
  th+='<button class="tab-btn'+(tab==='users'?' active':'')+'" data-tab="users" type="button">用户管理</button>';
  th+='<button class="tab-btn'+(tab==='grade'?' active':'')+'" data-tab="grade" type="button">等级定义</button>';
  for(var k in PROJECT_SCHEMA){var p=CONFIG.projects[k];th+='<button class="tab-btn'+(tab==='proj_'+k?' active':'')+'" data-tab="proj_'+k+'" type="button">'+escapeHtml(p.name)+'</button>';}
  modalBox.innerHTML='<div class="modal-title"><span>★ 管理后台</span><span class="modal-sub">'+escapeHtml(currentUser.name)+' · #'+escapeHtml(currentUser.id)+'</span></div><div class="admin-tabs">'+th+'</div><div id="tabContent"></div>';
  var btns=modalBox.querySelectorAll('.tab-btn');
  for(var i=0;i<btns.length;i++){(function(b){b.addEventListener('click',function(){renderAdminPanel(b.getAttribute('data-tab'));});})(btns[i]);}
  if(tab==='config')renderConfigTab();
  else if(tab==='leaderboard')renderLeaderboardTab();
  else if(tab==='users')renderUsersTab();
  else if(tab==='grade')renderGradeTab();
  else if(tab.indexOf('proj_')===0)renderProjectTab(tab.substring(5));
}
function renderField(f,v){var full=f.full?' full':'';var h='<div class="modal-field'+full+'"><label>'+escapeHtml(f.label)+'</label>';if(f.type==='textarea')h+='<textarea id="cfg_'+f.key+'" spellcheck="false">'+escapeHtml(v)+'</textarea>';else if(f.type==='number'){var st=f.step!==undefined?f.step:1,mn=f.min!==undefined?' min="'+f.min+'"':'',mx=f.max!==undefined?' max="'+f.max+'"':'';h+='<input type="number" id="cfg_'+f.key+'" value="'+escapeHtml(v)+'" step="'+st+'"'+mn+mx+'>';}else h+='<input type="text" id="cfg_'+f.key+'" value="'+escapeHtml(v)+'" spellcheck="false">';if(f.hint)h+='<div class="modal-hint">'+escapeHtml(f.hint)+'</div>';h+='</div>';return h;}
function renderConfigTab(){
  var slot=document.getElementById('tabContent');var h='',go=false;
  CONFIG_SCHEMA.forEach(function(f){if(f.section){if(go){h+='</div>';go=false;}h+='<div class="modal-section-title">'+escapeHtml(f.section)+'</div>';return;}if(!go){h+='<div class="modal-grid">';go=true;}h+=renderField(f,CONFIG[f.key]);});
  if(go)h+='</div>';
  h+='<div class="modal-actions"><button class="btn btn-primary" id="btnCfgSave" type="button">保存并重载</button><button class="btn" id="btnCfgClose" type="button">关闭</button></div>';
  slot.innerHTML=h;
  document.getElementById('btnCfgSave').addEventListener('click',function(){var next=Object.assign({},CONFIG);CONFIG_SCHEMA.forEach(function(f){if(f.section)return;var el=document.getElementById('cfg_'+f.key);if(!el)return;var v=el.value;if(f.type==='number'){var n=parseFloat(v);if(isNaN(n))return;if(f.min!==undefined)n=Math.max(f.min,n);if(f.max!==undefined)n=Math.min(f.max,n);next[f.key]=n;}else next[f.key]=v;});CONFIG=next;saveConfig();location.reload();});
  document.getElementById('btnCfgClose').addEventListener('click',closeModal);
}
function renderGradeTab(){var slot=document.getElementById('tabContent');slot.innerHTML='<div class="modal-section-title">等级定义</div><div class="modal-field full"><label>每行：等级 最低分（从高到低）</label><textarea id="cfg_gradeLines" spellcheck="false" style="min-height:260px">'+escapeHtml(CONFIG.gradeLines)+'</textarea></div><div class="modal-actions"><button class="btn btn-primary" id="btnGradeSave" type="button">保存并重载</button><button class="btn" id="btnGradeClose" type="button">关闭</button></div>';document.getElementById('btnGradeSave').addEventListener('click',function(){CONFIG.gradeLines=document.getElementById('cfg_gradeLines').value;saveConfig();location.reload();});document.getElementById('btnGradeClose').addEventListener('click',closeModal);}
function renderProjectTab(key){var slot=document.getElementById('tabContent');var schema=PROJECT_SCHEMA[key],proj=CONFIG.projects[key];if(!schema){slot.innerHTML='<div class="lb-empty">未知项目</div>';return;}var h='<div class="modal-section-title">'+escapeHtml(proj.name)+' 参数</div>';var go=false;schema.forEach(function(f){if(!go){h+='<div class="modal-grid">';go=true;}h+=renderField(f,proj[f.key]);});if(go)h+='</div>';h+='<div class="modal-actions"><button class="btn btn-primary" id="btnProjSave" type="button">保存</button><button class="btn" id="btnProjClose" type="button">关闭</button></div>';slot.innerHTML=h;document.getElementById('btnProjSave').addEventListener('click',function(){var next=JSON.parse(JSON.stringify(CONFIG.projects));schema.forEach(function(f){var el=document.getElementById('cfg_'+f.key);if(!el)return;var v=el.value;if(f.type==='number'){var n=parseFloat(v);if(isNaN(n))return;if(f.min!==undefined)n=Math.max(f.min,n);if(f.max!==undefined)n=Math.min(f.max,n);next[key][f.key]=n;}else next[key][f.key]=v;});CONFIG.projects=next;saveConfig();location.reload();});document.getElementById('btnProjClose').addEventListener('click',closeModal);}
function renderLeaderboardTab(){
  var slot=document.getElementById('tabContent');var list=cloudLeaderboardCache||[];
  var h='<div class="lb-toolbar"><button class="btn btn-sm" id="btnCloudReload" type="button">刷新</button></div>';
  h+='<div class="modal-hint" style="margin-bottom:12px">共 '+list.length+' 条记录</div>';
  if(list.length===0)h+='<div class="lb-empty">暂无记录</div>';
  else{
    h+='<div class="lb-admin-header"><div>序号</div><div>姓名</div><div style="text-align:right">总分</div><div>用户ID</div><div style="text-align:center">等级</div><div class="h-ts" style="text-align:right">时间戳</div><div style="text-align:right">操作</div></div>';
    list.forEach(function(item,idx){var c=gradeColor(item.rank);var star=item.is_admin?'<span class="star">★</span> ':'';h+='<div class="lb-admin-row'+(item.is_admin?' is-admin':'')+'"><div class="cell">#'+(idx+1)+'</div><div class="cell name">'+star+escapeHtml(item.name)+'</div><div class="cell num">'+item.score+'</div><div class="cell uid">'+escapeHtml(item.user_id||'—')+'</div><div class="cell rank" style="color:'+c+'">'+escapeHtml(item.rank)+'</div><div class="cell ts">'+formatTs(item.ts)+'</div><div class="cell actions"><button class="btn btn-sm btn-danger" data-del-cloud="'+item.id+'">删除</button></div></div>';});
  }
  h+='<div class="modal-actions"><button class="btn" id="btnLbClose" type="button">关闭</button></div>';
  slot.innerHTML=h;
  document.getElementById('btnCloudReload').addEventListener('click',async function(){await fetchCloudLeaderboard();renderLeaderboardTab();});
  document.getElementById('btnLbClose').addEventListener('click',closeModal);
  slot.querySelectorAll('[data-del-cloud]').forEach(function(b){b.addEventListener('click',async function(){var id=this.getAttribute('data-del-cloud');if(!confirm('删除这条记录？'))return;var res=await supabase.from('leaderboard').delete().eq('id',id);if(res.error){alert(res.error.message);return;}cloudLeaderboardCache=cloudLeaderboardCache.filter(function(x){return x.id!==id;});renderLeaderboardTab();refreshLeaderboardDisplay();});});
}
async function renderUsersTab(){
  var slot=document.getElementById('tabContent');
  slot.innerHTML='<div class="lb-empty">加载中...</div>';
  var res=await supabase.from('users').select('*').order('created_ts',{ascending:false}).limit(500);
  if(res.error){slot.innerHTML='<div class="lb-empty">读取失败：'+escapeHtml(res.error.message)+'</div>';return;}
  var list=res.data||[];
  var h='<div class="modal-hint" style="margin-bottom:12px">共 '+list.length+' 位用户（含管理员）</div>';
  if(list.length===0)h+='<div class="lb-empty">暂无用户</div>';
  else{
    h+='<div class="lb-admin-header" style="grid-template-columns:1fr 140px 60px 180px 100px"><div>名字</div><div>ID</div><div style="text-align:center">身份</div><div style="text-align:right">注册时间</div><div style="text-align:right">操作</div></div>';
    list.forEach(function(u){
      h+='<div class="lb-admin-row'+(u.is_admin?' is-admin':'')+'" style="grid-template-columns:1fr 140px 60px 180px 100px">'+
        '<div class="cell name">'+(u.is_admin?'<span class="star">★</span> ':'')+escapeHtml(u.name)+'</div>'+
        '<div class="cell uid">'+escapeHtml(u.id)+'</div>'+
        '<div class="cell" style="text-align:center;color:'+(u.is_admin?'#c084fc':'#666')+'">'+(u.is_admin?'管理员':'普通')+'</div>'+
        '<div class="cell ts">'+formatTs(u.created_ts)+'</div>'+
        '<div class="cell actions"><button class="btn btn-sm btn-danger" data-del-user="'+escapeHtml(u.id)+'" '+(u.id===DEFAULT_ADMIN_ID?'disabled':'')+'>删除</button></div>'+
      '</div>';
    });
  }
  h+='<div class="modal-actions"><button class="btn" id="btnUsersClose" type="button">关闭</button></div>';
  slot.innerHTML=h;
  document.getElementById('btnUsersClose').addEventListener('click',closeModal);
  slot.querySelectorAll('[data-del-user]').forEach(function(b){b.addEventListener('click',async function(){var id=this.getAttribute('data-del-user');if(!confirm('删除该用户？该用户的成绩不会自动删除。'))return;var r=await supabase.from('users').delete().eq('id',id);if(r.error){alert(r.error.message);return;}renderUsersTab();});});
}
modalOverlay.addEventListener('click',function(e){if(e.target===modalOverlay)closeModal();});

function initUI(){
  brandEl.innerHTML=renderBrand(CONFIG.brandName);brandMeta.textContent=CONFIG.brandMeta;document.title=CONFIG.brandName+' · 综合反应测试';
  GRADES=parseGrades(CONFIG.gradeLines);
  loginBrand.innerHTML=renderBrand(CONFIG.brandName);
  var u=loadCurrentUser();if(u&&u.name){currentUser=u;enterMain();}else renderLogin();
}
initUI();
</script>
</body>
